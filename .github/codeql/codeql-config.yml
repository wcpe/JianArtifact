# CodeQL 扫描范围：把 packages/devmock 排除在外，其余路径保持默认的完整规则集。
#
# 为什么排除：devmock 是浏览器端的 mock 层，只在开发预览与前端测试里运行，数据全部由测试
# 自身构造，不存在来自外部不可信来源的输入。它当前命中的三条规则（慢正则、原型污染、
# 从 HTTP 源下载）在语义上都只针对「不可信外部输入」，在这个目录里不成立：
#   - 慢正则命中仓库名/路径的转义与首尾斜杠裁剪，入参由测试用例直接给出，长度可控；
#   - 原型污染命中 state.assets[name] 这类以仓库名为键的索引赋值，而 name 在写入前已由
#     state.repositories.find() 校验必须是已存在的仓库，状态对象生命周期仅限单次测试；
#   - HTTP 下载命中测试里对本机 mock 服务发起的 fetch，目标恒为 http://localhost，
#     不经过真实网络，也没有敏感文件可泄露。
#
# 为什么不按规则关：CodeQL 的 query-filters 是**整份配置全局生效**的，没有「只在某个目录
# 关掉某条规则」的能力。若全局关掉这三条，apps/web 与 packages/ui 的原型污染、慢正则检测
# 会一并失效——那是真实生产代码，不能为了 test mock 的噪音把它们一起牺牲。因此这里选择
# 只排除目录，把完整规则集保留给所有生产路径。
#
# 代价：devmock 不再接受任何 CodeQL 语义扫描。该目录不随产品发布，安全要求低于生产路径，
# 且仍有 eslint、typecheck 与契约测试覆盖，这个取舍是可接受的。
#
# 背景：这些命中由历史提交引入，但任何改动到 store.ts / msw.test.ts 的分支都会让它们被
# 重新归属为「本 PR 新增告警」，使检查误报为失败，与本仓库「CodeQL 结果进 Security 面板
# 人工跟进、不阻断开发」的既定取向冲突。
name: CodeQL 配置

paths-ignore:
  - packages/devmock
