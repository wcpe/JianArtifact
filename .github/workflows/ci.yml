# 质量门只在 PR 上运行；主线发布由 release.yml 统一跑质量门并发布预览。
#
# 为什么拆成多个 job：单 job 串行跑完约 17 分钟（前端 ~5.5 分、后端 ~11 分），而后端
# 里 Go 测试占绝对主体（api 319s、repository 272s、domain 221s…）。拆开后各 job 在
# 独立 runner 上并行，墙上时间由「最慢的那条链」决定而不是「全部之和」。
#
# 依赖关系（由产物决定，不能随意并行）：
#   规范门禁 ─┐
#   前端测试 ─┼─> 构建产物（apps/web/dist）─> Go 静态 / Go 测试分片一 / 分片二
#             └─ 前端测试本身不依赖产物
# 后端 //go:embed all:dist 要求 dist 目录非空，而该目录不入库（见 .gitignore），
# 所以所有 Go job 都必须等「构建产物」完成。
name: CI

on:
  pull_request:

concurrency:
  # 同一 PR 的新提交取消旧运行，避免过期提交继续占用质量门。
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 规范门禁只读文件、耗时两秒级：单独成 job 可让违规在几十秒内暴露，
  # 不必等任何构建或测试。
  fr-numbers:
    name: 规范门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 需求编号不得进入代码
        run: bash scripts/check-fr-numbers.sh

  # 前端格式/静态/类型/测试：不依赖任何构建产物，可与「构建产物」并行。
  frontend:
    name: 前端质量门
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        # 版本取自 package.json packageManager 字段，勿再写 version 以免冲突
        uses: pnpm/action-setup@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: 恢复慢用例历史
        uses: actions/cache/restore@v6
        with:
          path: .tmp/slow-history.json
          # key 带 run_attempt：同一 run 重跑时 run_id 不变，若用 run_id 会精确命中上一次写入
          # 的条目并跳过保存（saveImpl 的 isExactKeyMatch 早退），新样本被静默丢弃。
          key: slow-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            slow-history-
      - name: 前端质量门
        env:
          JIAN_GATE_SCOPE: frontend
        run: bash scripts/check.sh
      # 慢用例观测：读上面这次运行产生的 .tmp 采样，与历史比对后追加新样本，
      # 因此必须紧跟在前端测试之后、保存历史之前。
      - name: 慢用例观测（仅告警、不阻断）
        run: node scripts/watch-slow-tests.mjs
      # 必须用 cache/save 子 action：组合式 actions/cache 的保存半程受 post-if: success() 门控，
      # 写在步骤上的 if: always() 只对 restore 半程生效，质量门失败时历史不会被保存。
      - name: 保存慢用例历史
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .tmp/slow-history.json
          key: slow-history-${{ github.run_id }}-${{ github.run_attempt }}

  # 产物 job：只安装依赖 + 构建，产出 apps/web/dist 与同步后的 apps/server/web/dist。
  # 它同时承担「构建验证」（vite build 必须成功），因此不重复跑前端测试。
  build-dist:
    name: 构建前端产物
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: 构建并同步到后端 embed 目录
        env:
          JIAN_GATE_SCOPE: build-dist
        run: bash scripts/check.sh
      # 只上传后端 embed 所需的那份，避免两份重复存储。
      - name: 上传 embed 产物
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: apps/server/web/dist
          retention-days: 1
          if-no-files-found: error

  # 后端静态检查与两个测试分片：三者互不依赖，全部并行。
  go-static:
    name: 后端静态检查
    needs: build-dist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      # 质量工具缓存：key 里钉死版本，因此只有当工具版本变化时才会失效重装。
      # 原先 govulncheck 用 @latest，每次运行的版本都可能变、而且必然重编译（实测这一步 54 秒），
      # 现在版本固定 + 二进制缓存命中即可跳过编译。
      # key 必须带上 Go 版本：govulncheck 用**构建它时的工具链**判定标准库漏洞版本，
      # 若沿用旧工具链编译好的二进制，升级 toolchain 后仍会按旧版本报告标准库漏洞（实测踩过）。
      - name: 缓存 Go 质量工具
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-go1.26.10-golangci-lint-v1.64.8-govulncheck-v1.8.0
      - name: 安装 Go 质量工具
        run: |
          command -v golangci-lint >/dev/null || go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          command -v govulncheck >/dev/null || go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: 下载 embed 产物
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: apps/server/web/dist
      - name: 后端静态检查
        env:
          JIAN_GATE_SCOPE: go-static
        run: bash scripts/check.sh

  go-test-1:
    name: 后端测试（一）
    needs: build-dist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: 下载 embed 产物
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: apps/server/web/dist
      - name: 后端测试（一）
        env:
          JIAN_GATE_SCOPE: go-test-1
        run: bash scripts/check.sh
      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: go-coverage-1
          path: .tmp/go-coverage-1.out
          retention-days: 1
          if-no-files-found: ignore

  go-test-2:
    name: 后端测试（二）
    needs: build-dist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: 下载 embed 产物
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: apps/server/web/dist
      - name: 后端测试（二）
        env:
          JIAN_GATE_SCOPE: go-test-2
        run: bash scripts/check.sh
      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: go-coverage-2
          path: .tmp/go-coverage-2.out
          retention-days: 1
          if-no-files-found: ignore

  go-test-3:
    name: 后端测试（三）
    needs: build-dist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: 下载 embed 产物
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: apps/server/web/dist
      - name: 后端测试（三）
        env:
          JIAN_GATE_SCOPE: go-test-3
        run: bash scripts/check.sh
      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: go-coverage-3
          path: .tmp/go-coverage-3.out
          retention-days: 1
          if-no-files-found: ignore
