# 质量门：PR 与任意分支推送均跑通；与本地 scripts/check.sh 对齐。
name: CI

on:
  pull_request:
  push:
    # main 由 release.yml 统一跑质量门 + 发预览，避免重复
    branches-ignore:
      - main
    tags-ignore:
      - "**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 质量门
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        # 版本取自 package.json packageManager 字段，勿再写 version 以免冲突
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: 安装 Go 质量工具
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          go install golang.org/x/vuln/cmd/govulncheck@latest

      # 慢用例观测的历史采样（scripts/watch-slow-tests.mjs 用它算跨运行 P95）。
      # actions/cache 的 key 不可变：restore 用稳定前缀 + restore-keys 回落读最近一次；
      # save 的 key 带 run_id 才能每次写入新条目（否则首次之后全部静默命中、不再更新）。
      # 注意：GitHub cache 是尽力而为的，可能 miss 或被清理——脚本在样本不足时会明确提示，
      # 不会把「没有历史」粉饰成「性能正常」。
      - name: 恢复慢用例历史
        uses: actions/cache/restore@v4
        with:
          path: .tmp/slow-history.json
          # key 带 run_attempt：同一 run 重跑时 run_id 不变，若用 run_id 会精确命中上一次写入
          # 的条目并跳过保存（saveImpl 的 isExactKeyMatch 早退），新样本被静默丢弃。
          key: slow-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            slow-history-

      - name: 运行统一质量门
        run: bash scripts/check.sh

      # 必须用 cache/save 子 action：组合式 actions/cache 的保存半程受 post-if: success() 门控，
      # 写在步骤上的 if: always() 只对 restore 半程生效，质量门失败时历史不会被保存。
      - name: 保存慢用例历史
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .tmp/slow-history.json
          key: slow-history-${{ github.run_id }}-${{ github.run_attempt }}
