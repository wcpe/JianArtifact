  /api/v1/repositories/{name}/online:
    put:
      operationId: setRepositoryOnline
      summary: 设置仓库 online/offline 状态（仅管理员）
      description: |
        仅管理员可操作。online 是节点本地运维状态：不参与复制（M-2），
        对端复制应用仓库变更不会覆盖本地 online，SetOnline 亦不产生复制变更日志。
      parameters:
        - $ref: "#/components/parameters/RepoNameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRepositoryOnlineRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/repositories/{name}/recheck-connection:
    post:
      operationId: recheckRepositoryConnection
      summary: 手动重测仓库上游连接（仅管理员）
      description: |
        仅管理员可操作；仅 online 的 proxy 仓库可重测。立即发起一次上游 HEAD 探测，
        更新 auto-block 状态并返回最新连接状态（不等待自动阻止窗口）。
      parameters:
        - $ref: "#/components/parameters/RepoNameParam"
      responses:
        "200":
          description: 重测完成，返回最新连接状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/repositories/{name}/assets:
