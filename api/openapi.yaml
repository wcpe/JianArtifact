        pending: { type: integer, format: int64, minimum: 0 }
        readyRecords: { type: integer, format: int64, minimum: 0 }
        pendingRecords: { type: integer, format: int64, minimum: 0 }
        readyOperations: { type: integer, format: int64, minimum: 0 }
        pendingBlobs: { type: integer, format: int64, minimum: 0 }
