        items:
          type: array
          items:
            $ref: "#/components/schemas/UserGroupMember"
    CreateUserGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: 组名（全局唯一，不可为空白）
        description:
          type: string
    UpdateUserGroupRequest:
      type: object
      properties:
        name:
          type: string
          description: 新组名（空串表示不改；全局唯一）
        description:
          type: string
          description: 新说明（空串表示不改）
    AddUserGroupMemberRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          format: int64
          description: 待加入该组的用户 ID（必须已存在）
    PublishPolicyRequest:
      type: object
      properties:
        webLoginDisabled:
          type: boolean
          description: 是否禁止该账号登录 Web 与管理 API
        allowedPrefixes:
          type: array
          items:
            type: string
          description: 可选的发布路径前缀；空数组表示不限制前缀
        pathPrefixes:
          type: array
          items:
            type: string
          description: allowedPrefixes 的兼容别名
        maxAssetsHour:
          type: integer
          format: int64
          minimum: 0
          description: 每小时新增制品数上限；零表示不限制
        maxBytesDay:
          type: integer
          format: int64
          minimum: 0
          description: 每日上传总字节上限；零表示不限制
        maxFileBytes:
          type: integer
          format: int64
          minimum: 0
          description: 单文件字节上限；零表示不限制
        immutableRelease:
          type: boolean
          description: 已废弃，只读兼容字段；写入会被拒绝，请改用仓库 immutableRelease 配置
    PublishPoliciesBatchRequest:
      type: object
      description: |
        把同一份发布策略批量应用到多个 Hosted 仓库；策略字段与单仓库端点一致。
        仓库列表至少一个，任一仓库不存在或不是 hosted 都会导致整体拒绝。
      allOf:
        - $ref: "#/components/schemas/PublishPolicyRequest"
        - type: object
          required: [repositories]
          properties:
            repositories:
              type: array
              minItems: 1
              items:
                type: string
              description: 目标 Hosted 仓库名列表；重复名会被去重，顺序保留首次出现的位置
    PublishPolicyBatchResult:
      type: object
      required: [repository, ok]
      properties:
        repository:
          type: string
          description: 本条结果对应的仓库名
        ok:
          type: boolean
          description: 该仓库是否保存成功
        error:
          type: string
          description: 失败原因；仅在 ok 为 false 时出现
    PublishPoliciesBatchResponse:
      type: object
      description: 逐仓库保存结果；顺序与请求中的仓库列表一致
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PublishPolicyBatchResult"
    PublishPolicyResponse:
      type: object
      required:
        [
          userId,
          username,
          webLoginDisabled,
          repository,
          allowedPrefixes,
          maxAssetsHour,
          maxBytesDay,
          maxFileBytes,
          immutableRelease,
        ]
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        webLoginDisabled:
          type: boolean
        repository:
          type: string
        allowedPrefixes:
          type: array
          items:
            type: string
        maxAssetsHour:
          type: integer
          format: int64
        maxBytesDay:
          type: integer
          format: int64
        maxFileBytes:
          type: integer
          format: int64
        immutableRelease:
          type: boolean
          description: 只读兼容字段，值来自仓库 immutableRelease 配置
    PasswordChangeRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
    Token:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    TokenCreated:
      type: object
      required: [id, name, token, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        token:
          type: string
          description: 明文令牌，仅此次返回一次。
        createdAt:
          type: string
    Repository:
      type: object
      required: [id, name, format, type, visibility, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        format:
          type: string
          enum: [raw, maven, npm, docker, cargo, pypi, gomod, nuget]
        type:
          type: string
          enum: [hosted, proxy, group]
        visibility:
          type: string
          enum: [public, private]
        online:
          type: boolean
          description: 仓库是否在线（管理员可手动置离线；offline 不参与复制）
        connectionStatus:
          $ref: "#/components/schemas/ConnectionStatus"
          description: 上游连接状态（仅 proxy/group 返回；可选字段，向后兼容）
        description:
          type: string
          description: 仓库描述（管理后台可配置，详情页展示）
        remoteUrl:
          type: string
          description: proxy 仓库的上游地址（仅 type=proxy）
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: proxy 上游凭据的受限逻辑名称；运行时仅从 JIAN_UPSTREAM_CREDENTIAL_<名称> 读取（仅 type=proxy，非密钥明文）
        immutableRelease:
          type: boolean
          description: hosted 仓库是否拒绝覆盖已存在的 Release
        members:
          type: array
          items:
            type: string
          description: group 仓库的成员仓库名（有序，仅 type=group）
        aliases:
          type: array
          items:
            type: string
          description: 仓库别名列表（可多个；别名与主名共享命名空间、全局唯一，重命名后旧名自动转别名）
        quotaBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            仓库存储配额上限（字节）；0 或缺省表示不限。
            计量口径是**逻辑字节** `SUM(asset.size)`（按制品记录大小累加，不是去重后的物理占用
            ——去重 blob 无法按仓库归属）；超出后该仓库的写入被拒绝（HTTP 429，`quota_exceeded`）。
        quotaAssets:
          type: integer
          format: int64
          minimum: 0
          description: |
            仓库制品数配额上限；0 或缺省表示不限。
            计量口径是**制品计数** `COUNT(*)`（与 artifactCount 同一口径）；
            超出后该仓库的写入被拒绝（HTTP 429，`quota_exceeded`）。
        cacheRetentionDays:
          type: integer
          minimum: 0
          description: |
            仓库代理缓存资产的保留天数；0 或缺省表示关闭（默认）。
            仅 proxy 仓库可设置（hosted/group 恒为 0 或缺省）：开启后 storage-cleanup 作业会淘汰
            该仓库内 `updated_at` 早于「当前时间 − 保留天数」的缓存资产，删除走既有资产变更通道；
            保留天数按 24 小时整数天计。
        createdAt:
          type: string
        artifactCount:
          type: integer
          description: 仓库内制品数量（只读统计字段；即 quotaAssets 的计量口径 COUNT(*)）
        totalSize:
          type: integer
          format: int64
          description: 仓库内制品总字节数（只读统计字段；即 quotaBytes 的计量口径 SUM(asset.size)）
    RepositoryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
        total:
          type: integer
    PublicRepositoryList:
      type: object
      description: |
        公开仓库列表：items/total 与 RepositoryList 同构，额外携带 pinnedNames —— 全局置顶
        仓库的当前主名（顺序即置顶顺序），供公开页（匿名浏览）排序与展示图钉。
      required: [items, total, pinnedNames]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
        total:
          type: integer
        pinnedNames:
          type: array
          description: 全局置顶仓库的当前主名（有序；公开页据此置顶前置并显示图钉）。
          items:
            type: string
    PinnedRepositoriesResponse:
      type: object
      description: |
        置顶仓库响应：repositoryIds 为仓库 ID（持久化关联，重命名不受影响），names 为读取时
        实时解析的当前主名，两者一一对应、顺序一致（顺序即置顶顺序）。
      required: [repositoryIds, names]
      properties:
        repositoryIds:
          type: array
          description: 置顶仓库的 ID（按置顶顺序）。
          items:
            type: integer
            format: int64
        names:
          type: array
          description: 置顶仓库的当前主名（按置顶顺序；已删除仓库不出现在此列表）。
          items:
            type: string
    PutPinnedRepositoriesRequest:
      type: object
      description: |
        覆盖式写入置顶集合：整体替换当前作用域的置顶，空数组即取消全部置顶。
        `repositoryIds` 必须**显式提供**（缺省即 400）：空数组表示「取消全部置顶」，
        与「字段漏传」语义不同——后者若按空数组处理会静默清空既有置顶。
      properties:
        repositoryIds:
          type: array
          description: 置顶仓库的完整 ID 集合（按期望顺序；服务端去重后按序写入）；必须显式提供。
          items:
            type: integer
            format: int64
    CreateRepositoryRequest:
      type: object
      required: [name, format, type]
      properties:
        name:
          type: string
          minLength: 1
        format:
          type: string
          enum: [raw, maven, npm, docker, cargo, pypi, gomod, nuget]
        type:
          type: string
          enum: [hosted, proxy, group]
        visibility:
          type: string
          enum: [public, private]
          default: private
        description:
          type: string
          description: 仓库描述（可选）
        remoteUrl:
          type: string
          description: proxy 仓库的上游地址（type=proxy 时必填）
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: proxy 上游凭据的受限逻辑名称；运行时仅从 JIAN_UPSTREAM_CREDENTIAL_<名称> 读取（仅 type=proxy，非密钥明文）
        immutableRelease:
          type: boolean
          description: 创建 hosted 仓库时是否拒绝覆盖已存在的 Release
        members:
          type: array
          items:
            type: string
          description: group 仓库的成员仓库名（有序，type=group 时必填）
        aliases:
          type: array
          items:
            type: string
          description: 仓库别名（可选；与主名共享命名空间、全局唯一，不得等于主名或与他仓主名/别名冲突）
        quotaBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            仓库存储配额上限（字节）；0 或缺省表示不限。
            计量口径是**逻辑字节** `SUM(asset.size)`（不是去重后的物理占用）；超出后写入被拒绝（HTTP 429，`quota_exceeded`）。
        quotaAssets:
          type: integer
          format: int64
          minimum: 0
          description: |
            仓库制品数配额上限；0 或缺省表示不限。
            计量口径是**制品计数** `COUNT(*)`；超出后写入被拒绝（HTTP 429，`quota_exceeded`）。
        cacheRetentionDays:
          type: integer
          minimum: 0
          description: |
            代理缓存资产的保留天数（仅 type=proxy 可设置；0 或缺省表示关闭）。
            开启后 storage-cleanup 作业按此值淘汰该仓库的超期缓存资产；其他类型传非 0 值会被拒绝。
    UpdateRepositoryRequest:
      type: object
      properties:
        visibility:
          type: string
          enum: [public, private]
        description:
          type: string
          description: 更新仓库描述（传空串表示清空）
        remoteUrl:
          type: string
          description: 更新 proxy 上游地址（仅 type=proxy）
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 更新 proxy 上游凭据的受限逻辑名称；运行时仅从 JIAN_UPSTREAM_CREDENTIAL_<名称> 读取（仅 type=proxy，非密钥明文）
        immutableRelease:
          type: boolean
          description: 更新 hosted 仓库是否拒绝覆盖已存在的 Release
        members:
          type: array
          items:
            type: string
          description: 更新 group 成员仓库名（仅 type=group）
        aliases:
          type: array
          items:
            type: string
          description: 覆盖式更新仓库别名集合（传空数组表示清空；与主名共享命名空间、全局唯一）
        quotaBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            更新仓库存储配额上限（字节）：传 0 表示改为不限；缺省表示不修改。
            计量口径是**逻辑字节** `SUM(asset.size)`；超出后写入被拒绝（HTTP 429，`quota_exceeded`）。
        quotaAssets:
          type: integer
          format: int64
          minimum: 0
          description: |
            更新仓库制品数配额上限：传 0 表示改为不限；缺省表示不修改。
            计量口径是**制品计数** `COUNT(*)`；超出后写入被拒绝（HTTP 429，`quota_exceeded`）。
        cacheRetentionDays:
          type: integer
          minimum: 0
          description: |
            更新代理缓存保留天数：传 0 表示关闭；缺省表示不修改。仅 type=proxy 可设置。
    RenameRepositoryRequest:
      type: object
      required: [newName]
      properties:
        newName:
          type: string
          minLength: 1
          description: 仓库新名称（非空；不得与任何主名/别名冲突。重命名后旧名自动转为别名，仍可解析到该仓库）
    SetRepositoryOnlineRequest:
      type: object
      properties:
        online:
          type: boolean
          description: 是否在线（true=在线，false=离线；必填）
    ConnectionStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [READY, AVAILABLE, UNAVAILABLE, AUTO_BLOCKED, OFFLINE]
          description: 上游连接状态（READY=尚未探测，AVAILABLE=可用，AUTO_BLOCKED=自动阻止，UNAVAILABLE=不可用，OFFLINE=手动离线）
        blockedUntil:
          type: string
          format: date-time
          nullable: true
          description: 自动阻止窗口截止时间（非阻止状态为 null）
        description:
          type: string
          description: 状态说明（供展示）
    AclEntry:
      type: object
      description: |
        一条仓库授权（主体 × 动作）。主体分两类（FR-36）：
        - `subjectType=user`（默认）：`subjectId` 必填，填用户 ID；
        - `subjectType=group`：`subjectGroupId` 必填，填用户组 ID。
        两个 ID 字段互斥：服务端按 `subjectType` 只读取对应那一列，
        另一列即使有值也会被忽略（表内 CHECK 强制恰有其一）。
      required: [action]
      properties:
        subjectId:
          type: integer
          format: int64
          description: 用户主体 ID（`subjectType=user` 时必填；group 主体不填）
        subjectType:
          type: string
          enum: [user, group]
          description: |
            授权主体类型：user=单个用户，group=用户组（组内成员全部生效）。
            缺省（不传）按 user 解释——既有三档时代的请求体只有 subjectId，
            沿用该缺省即可无改动继续工作。
        subjectGroupId:
          type: integer
          format: int64
          nullable: true
          description: 用户组主体 ID（`subjectType=group` 时必填；user 主体为 null）
        action:
          type: string
          enum: [read, write, publish, delete, acl_manage, admin]
          description: |
            授权动作（FR-36 六档，由粗到细）：
            - read 读取 / 下载；
            - write 写入，蕴含 read 与 publish；
            - publish 仅发布（协议上传），不蕴含写其它路径；
            - delete 删除制品；
            - acl_manage 管理该仓库的 ACL；
            - admin 该仓库的全权管理，蕴含其余五档。
            未登记的动作一律按「只由自身满足」判定，不会被宽泛授权放行。
    AclList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AclEntry"
    PutAclRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AclEntry"
    AssetSummary:
      type: object
      required: [path, size, hash, updatedAt]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        hash:
          type: string
          description: 内容寻址 blob 的 sha256 摘要
        sha1:
          type: string
          description: 制品内容的 SHA-1 摘要（写入时计算登记）
        md5:
          type: string
          description: 制品内容的 MD5 摘要（写入时计算登记）
        contentType:
          type: string
        createdAt:
          type: string
          description: 首次写入时间
        updatedAt:
          type: string
    AssetList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssetSummary"
        total:
          type: integer
    BatchDeleteAssetsRequest:
      type: object
      required: [paths, overrideReason]
      properties:
        paths:
          type: array
          description: 待删除的制品路径列表（单条非空，上限 500 条）
          minItems: 1
          maxItems: 500
          items:
            type: string
        overrideReason:
          type: string
          minLength: 1
          maxLength: 512
          description: 管理员执行批量删除的原因
    BatchDeleteAssetFailure:
      type: object
      required: [path, error]
      properties:
        path:
          type: string
        error:
          type: string
    BatchDeleteAssetsResponse:
      type: object
      required: [deleted, failed]
      properties:
        deleted:
          type: integer
          description: 成功删除的制品数
        failed:
          type: array
          items:
            $ref: "#/components/schemas/BatchDeleteAssetFailure"
          description: 兼容字段；统一事务成功时始终为空数组
    AssetOperationRequest:
      type: object
      required: [action, targets, overrideReason]
      properties:
        action:
          type: string
          enum: [delete, move, rename]
        targets:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/AssetOperationTarget"
        destinationPath:
          type: string
          description: move 的目标目录；保留所选文件名和相对层级
        newPath:
          type: string
          description: rename 的新完整路径，仅允许单项
        overrideReason:
          type: string
          minLength: 1
          maxLength: 512
          description: 管理员执行资产变更的原因，协议端点不要求此字段
    AssetOperationTarget:
      type: object
      required: [type, path]
      properties:
        type:
          type: string
          enum: [raw_path, maven_version, maven_artifact, npm_package, npm_version, asset_path]
        path:
          type: string
          description: 目标路径或格式逻辑标识；npm_version 使用 package@version
    AssetOperationResponse:
      type: object
      required: [operationId, affected]
      properties:
        operationId:
          type: string
        affected:
          type: integer
          description: 实际变更的资产数量
    UsageSnippet:
      type: object
      required: [title, code, group, tool]
      properties:
        title:
          type: string
        description:
          type: string
        code:
          type: string
        group:
          type: string
          enum: [auth, resolve, publish, other]
          description: 按用途分组，供界面折叠分区：认证 / 解析依赖 / 发布制品 / 其他
        tool:
          type: string
          description: >-
            使用方式 / 构建工具标识，用于界面在分组内做工具切换；与 group 一样是结构化标记，不参与本地化。
            当前取值：maven | gradle | gradle-kts | sbt | ivy | ant | npm | pnpm | yarn | bun | curl | wget
    UsageInfo:
      type: object
      required: [format, type, snippets]
      properties:
        format:
          type: string
        type:
          type: string
        description:
          type: string
          description: 仓库描述（匿名详情页页头展示）
        snippets:
          type: array
          items:
            $ref: "#/components/schemas/UsageSnippet"
    MigrationSourceType:
      type: string
      enum: [online_rest, offline_dir, offline_bundle]
    MigrationConflictPolicy:
      type: string
      enum: [skip, overwrite, fail]
      default: skip
    MigrationTaskStatus:
      type: string
      enum: [planned, running, completed, failed, cancelled]
    MigrationSourceAuthType:
      type: string
      enum: [anonymous, basic, bearer]
      description: 在线 Nexus 来源认证方式；不包含用户名、密码或令牌。
    MigrationSourceAuthAnonymous:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [anonymous]
    MigrationSourceAuthBasic:
      type: object
      required: [type, username, password]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [basic]
        username:
          type: string
          minLength: 1
          description: Nexus 用户名或 User Token 名称；仅写入。
          writeOnly: true
        password:
          type: string
          minLength: 1
          description: Nexus 密码或 User Token Passcode；仅写入。
          writeOnly: true
    MigrationSourceAuthBearer:
      type: object
      required: [type, token]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [bearer]
        token:
          type: string
          minLength: 1
          description: Nexus JWT、Access Token 或 npm Token；仅写入。
          writeOnly: true
    MigrationSourceAuth:
      oneOf:
        - $ref: "#/components/schemas/MigrationSourceAuthAnonymous"
        - $ref: "#/components/schemas/MigrationSourceAuthBasic"
        - $ref: "#/components/schemas/MigrationSourceAuthBearer"
      discriminator:
        propertyName: type
        mapping:
          anonymous: "#/components/schemas/MigrationSourceAuthAnonymous"
          basic: "#/components/schemas/MigrationSourceAuthBasic"
          bearer: "#/components/schemas/MigrationSourceAuthBearer"
      description: 在线 Nexus 来源认证材料；仅请求写入，服务端加密保存，永不在响应、任务、报告或日志中返回。
    RemoteNexusRepositoryRequest:
      type: object
      required: [sourceConfig]
      additionalProperties: false
      properties:
        sourceConfig:
          $ref: "#/components/schemas/RemoteNexusSourceConfig"
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 兼容已有在线来源的上游凭据逻辑名称；与 sourceAuth 互斥。
        sourceAuth:
          $ref: "#/components/schemas/MigrationSourceAuth"
    RemoteNexusSourceConfig:
      oneOf:
        - $ref: "#/components/schemas/MigrationOnlineURLSourceConfig"
        - $ref: "#/components/schemas/MigrationOnlineSourceRefConfig"
      description: 在线 Nexus 来源配置；直填 URL 或兼容 sourceRef 二选一，禁止认证材料和离线路径。
    RemoteNexusRepository:
      type: object
      required: [name, format, type]
      properties:
        name:
          type: string
        format:
          type: string
        type:
          type: string
          enum: [hosted, proxy, group]
    RemoteNexusRepositoryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RemoteNexusRepository"
        total:
          type: integer
    MigrationSourceConfig:
      oneOf:
        - $ref: "#/components/schemas/MigrationOnlineURLSourceConfig"
        - $ref: "#/components/schemas/MigrationOnlineSourceRefConfig"
        - $ref: "#/components/schemas/MigrationOfflineSourceConfig"
      description: 来源配置。online_rest 提供 url 或 sourceRef 二选一；offline_dir 与 offline_bundle 仅提供 path。禁止认证材料和其他字段。
    MigrationOnlineURLSourceConfig:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: 外部 Nexus REST 基址；仅允许无用户信息、查询参数和片段的绝对 http 或 https URL。
    MigrationOnlineSourceRefConfig:
      type: object
      required: [sourceRef]
      additionalProperties: false
      properties:
        sourceRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 兼容已有任务的受限逻辑来源名称；运行时仅从 JIAN_MIGRATION_SOURCE_<名称> 读取。
    MigrationOfflineSourceConfig:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          description: 离线目录或离线导出包路径。
    MigrationPlanRepository:
      type: object
      required: [name, format]
      properties:
        name:
          type: string
        format:
          type: string
          enum: [raw, maven, npm, docker, cargo, pypi, gomod, nuget]
        type:
          type: string
          enum: [hosted, proxy, group]
        estimatedAssets:
          type: integer
          format: int64
        config:
          type: object
          additionalProperties: true
          description: 无敏感的目标配置摘要
        migrationMode:
          type: string
          enum: [assets, proxy_config, group_config, unsupported]
        warnings:
          type: array
          items:
            type: string
    MigrationPlan:
      type: object
      required: [repositories, warnings, stats]
      properties:
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/MigrationPlanRepository"
        warnings:
          type: array
          items:
            type: string
        stats:
          type: object
          additionalProperties: true
        estimated:
          type: boolean
          description: 资产数是否为估算
        sourceRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: online_rest 的受限逻辑来源名称；运行时仅从 JIAN_MIGRATION_SOURCE_<名称> 读取，不包含 URL、主机名、IP 或凭据
    MigrationTask:
      type: object
      required: [id, status, sourceType, conflictPolicy, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/MigrationTaskStatus"
        sourceType:
          $ref: "#/components/schemas/MigrationSourceType"
        sourceConfig:
          $ref: "#/components/schemas/MigrationSourceConfig"
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 上游凭据的受限逻辑名称；运行时仅从 JIAN_UPSTREAM_CREDENTIAL_<名称> 读取，非密钥明文
        sourceAuthType:
          $ref: "#/components/schemas/MigrationSourceAuthType"
        conflictPolicy:
          $ref: "#/components/schemas/MigrationConflictPolicy"
        plan:
          $ref: "#/components/schemas/MigrationPlan"
        errorMessage:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        startedAt:
          type: string
        finishedAt:
          type: string
    MigrationTaskList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MigrationTask"
        total:
          type: integer
    CreateMigrationRequest:
      type: object
      required: [sourceType]
      properties:
        sourceType:
          $ref: "#/components/schemas/MigrationSourceType"
        sourceConfig:
          $ref: "#/components/schemas/MigrationSourceConfig"
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 兼容已有在线来源的上游凭据逻辑名称；与 sourceAuth 互斥。
        sourceAuth:
          $ref: "#/components/schemas/MigrationSourceAuth"
        conflictPolicy:
          $ref: "#/components/schemas/MigrationConflictPolicy"
        plan:
          $ref: "#/components/schemas/MigrationPlan"
    StartMigrationRequest:
      type: object
      properties:
        includeRepositories:
          type: array
          items:
            type: string
          description: 启动前收窄 plan，仅迁移这些仓库；空或省略表示全部
    MigrationDiscoverRequest:
      type: object
      required: [sourceType]
      properties:
        sourceType:
          $ref: "#/components/schemas/MigrationSourceType"
        sourceConfig:
          $ref: "#/components/schemas/MigrationSourceConfig"
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 兼容已有在线来源的上游凭据逻辑名称；与 sourceAuth 互斥。
        sourceAuth:
          $ref: "#/components/schemas/MigrationSourceAuth"
        conflictPolicy:
          $ref: "#/components/schemas/MigrationConflictPolicy"
    MigrationDiscoverResponse:
      type: object
      required: [taskId, plan]
      properties:
        taskId:
          type: integer
          format: int64
        plan:
          $ref: "#/components/schemas/MigrationPlan"
    MigrationReport:
      type: object
      required: [taskId, status, totals]
      properties:
        taskId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/MigrationTaskStatus"
        sourceType:
          $ref: "#/components/schemas/MigrationSourceType"
        conflictPolicy:
          $ref: "#/components/schemas/MigrationConflictPolicy"
        startedAt:
          type: string
        finishedAt:
          type: string
        totals:
          type: object
          additionalProperties: true
        repositories:
          type: array
          items:
            type: object
            additionalProperties: true
        failures:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        cutover:
          type: object
          additionalProperties: true
        raw:
          type: object
          additionalProperties: true
          description: 任务 report_json 原文透传（foundation 可为空对象）
    BackupCounts:
      type: object
      additionalProperties: false
      description: 包内各实体记录数，供导入端核对规模。
      properties:
        users:
          type: integer
        tokens:
          type: integer
        repositories:
          type: integer
        acls:
          type: integer
        assets:
          type: integer
        formatMetadata:
          type: integer
    BackupPackage:
      type: object
      required: [packageId, mode, status, sizeBytes, createdAt]
      additionalProperties: false
      description: 节点备份包登记（包体为 tar.gz，不含密钥与节点本地配置）。
      properties:
        packageId:
          type: string
        mode:
          type: string
          enum: [hot, frozen]
        basePackageId:
          type: string
          description: 非空表示这是基于该基线包生成的增量差包。
        status:
          type: string
          enum: [queued, snapshotting, packing, done, failed]
        label:
          type: string
        sizeBytes:
          type: integer
          format: int64
        counts:
          $ref: "#/components/schemas/BackupCounts"
        nodeId:
          type: string
        appVersion:
          type: string
        dbSchemaVersion:
          type: integer
        createdAt:
          type: string
        finishedAt:
          type: string
        errorSummary:
          type: string
    BackupPackageList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupPackage"
        total:
          type: integer
    CreateBackupRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [hot, frozen]
        label:
          type: string
          maxLength: 200
    CreateBackupLinkRequest:
      type: object
      additionalProperties: false
      properties:
        ttlSeconds:
          type: integer
          description: 链接有效期（秒），默认 1800，上限 86400。
          minimum: 60
          maximum: 86400
    BackupLink:
      type: object
      required: [url, expiresAt]
      additionalProperties: false
      properties:
        url:
          type: string
        expiresAt:
          type: string
    BackupVerification:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
        packageId:
          type: string
        deep:
          type: boolean
        blobs:
          type: integer
        assets:
          type: integer
        error:
          type: string
    WriteFreezeState:
      type: object
      required: [frozen]
      additionalProperties: false
      description: 节点写入冻结状态。未冻结时 until/frozenAt 缺省（表示当前无生效窗口）。
      properties:
        frozen:
          type: boolean
        until:
          type: string
          format: date-time
          description: 冻结自动解除的时刻；手动冻结且无窗口时缺省。
        frozenAt:
          type: string
          format: date-time
        reason:
          type: string
    FreezeWritesRequest:
      type: object
      additionalProperties: false
      description: until 与 ttlSeconds 二选一；都给时 until 优先。都不给则用 ttlSeconds 默认 7200。窗口上限 24 小时。
      properties:
        until:
          type: string
          format: date-time
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        reason:
          type: string
          maxLength: 200
    MaintenanceJob:
      type: object
      description: |
        单个周期作业的状态快照。计数自进程启动累计（重启归零）；
        未执行过时 lastStartedAt / lastFinishedAt / lastError 缺省（等价于 null）。
      required: [name, intervalSeconds, running, runs, failures]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 作业名（调度器注册名，注册后不可变）
        intervalSeconds:
          type: integer
          format: int64
          description: 触发间隔秒数；启动不立即执行，首次执行在第一个间隔到期后
        running:
          type: boolean
          description: 当前是否正在执行（判断作业是否跑完请用本字段，而不是 runs 与 failures 是否相等）
        runs:
          type: integer
          format: int64
          minimum: 0
          description: 累计执行次数（含失败；在每次执行开始时计入）
        failures:
          type: integer
          format: int64
          minimum: 0
          description: 累计失败次数（含 panic；在每次执行结束时回填，执行中可能与 runs 瞬时不等）
        lastStartedAt:
          type: string
          format: date-time
          nullable: true
          description: 最近一次开始时间；未执行过为 null
        lastFinishedAt:
          type: string
          format: date-time
          nullable: true
          description: 最近一次结束时间；未执行完成过为 null
        lastError:
          type: string
          nullable: true
          description: 最近一次失败描述；最近一次执行成功或未执行为 null
    MaintenanceJobList:
      type: object
      description: 已注册的周期作业清单；按注册顺序返回。
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceJob"
    MaintenanceJobRunResult:
      type: object
      description: 手动触发结果；started 恒为 true——202 表示已受理，不代表作业已执行完成。
      required: [name, started]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        started:
          type: boolean
    BackupImportOrigin:
      type: string
      enum: [url, upload, cli]
    BackupUploadStatus:
      type: string
      enum: [initialized, receiving, completed, aborted]
    BackupUploadSession:
      type: object
      required: [uploadId, fileName, totalBytes, chunkSize, uploadedChunks, status, expiresAt]
      additionalProperties: false
      description: 一次分片上传会话的视图。uploadedChunks 由磁盘上真实存在的分片推导（以磁盘为准，可续传）。
      properties:
        uploadId:
          type: string
        fileName:
          type: string
        totalBytes:
          type: integer
          format: int64
        chunkSize:
          type: integer
          format: int64
        uploadedChunks:
          type: array
          items:
            type: integer
        status:
          $ref: "#/components/schemas/BackupUploadStatus"
        expiresAt:
          type: string
          format: date-time
    CreateBackupUploadRequest:
      type: object
      required: [fileName, totalBytes]
      additionalProperties: false
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        totalBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 53687091200
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 可选：归档整体摘要（64 位小写 hex），拼装完成后核对。
    CompleteBackupUploadRequest:
      type: object
      additionalProperties: false
      properties:
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 可选：客户端侧声明的归档摘要，拼装完成后核对。
        overwrite:
          type: boolean
          description: 目标实例非空时需显式置真。内置 anonymous 主体不计入「非空」。
        deep:
          type: boolean
          description: 逐 blob 比对内容摘要（耗时与包体积同阶）。
    BackupImportStatus:
      type: string
      enum: [queued, fetching, staging, pending_restart, done, failed]
    BackupImport:
      type: object
      required: [importId, origin, status, operator, overwrite, deep, createdAt, updatedAt]
      additionalProperties: false
      description: |
        一次导入的记录。pending_restart 表示校验与暂存已完成、restore.pending 已写入，
        需重启服务才会替换数据库并转为 done。
      properties:
        importId:
          type: string
        origin:
          $ref: "#/components/schemas/BackupImportOrigin"
        status:
          $ref: "#/components/schemas/BackupImportStatus"
        sourceUrl:
          type: string
          description: URL 拉取通道的来源地址；其它通道缺省。
        operator:
          type: string
        overwrite:
          type: boolean
        deep:
          type: boolean
        totalBytes:
          type: integer
          format: int64
        fetchedBytes:
          type: integer
          format: int64
        blobCount:
          type: integer
        packageId:
          type: string
          description: 包内 manifest 的 packageId（校验通过后才有值）。
        errorCode:
          type: string
        error:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        finishedAt:
          type: string
        restorePendingAt:
          type: string
    BackupImportList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupImport"
        total:
          type: integer
    CreateBackupImportRequest:
      type: object
      required: [sourceUrl]
      additionalProperties: false
      properties:
        sourceUrl:
          type: string
          maxLength: 2048
          description: 备份包归档的 http/https 地址。
        overwrite:
          type: boolean
          description: 目标实例非空时需显式置真。内置 anonymous 主体不计入「非空」。
        deep:
          type: boolean
          description: 逐 blob 比对内容摘要（耗时与包体积同阶）。
        expectedSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 可选：拉取完成后核对的归档摘要。
