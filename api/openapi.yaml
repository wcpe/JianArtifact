      type: object
      description: 单个分组在整段窗口内的累计下载（饼图数据源；按 count 降序返回）。
      required: [group, count]
      properties:
        group:
          type: string
          description: 分组取值：groupBy=ip 时为来源 IP 明文，=family 时为 UA 归类结果。
          minLength: 1
          maxLength: 255
        count:
          type: integer
          format: int64
          minimum: 0
    DownloadGroupedTrendResponse:
      type: object
