          description: 使用片段
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/migrations/discover:
    post:
      operationId: discoverMigrations
      summary: 三来源发现并落库为 planned 任务（不同步执行）
      description: |
        同步执行发现；成功写入一条 status=planned 的 migration_task，返回 taskId 与 plan。
        online_rest 可提交 Nexus 基址与仅写入的 sourceAuth；认证材料只用于加密保存，绝不出现在响应。
        失败不落库。真正搬运须 POST /migrations/{id}/start。仅 admin。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationDiscoverRequest"
      responses:
        "200":
          description: 发现成功并已落库 planned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationDiscoverResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: 上游 Nexus 不可达
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/migrations/remote-repositories:
    post:
      operationId: listRemoteNexusRepositories
      summary: 枚举在线 Nexus 仓库索引（仅管理员）
      description: |
        不创建迁移任务、不扫描资产。在线来源通过 sourceConfig 提供直填 Nexus 基址或兼容的 sourceRef。
        可选 sourceAuth 仅用于本次请求，不会落库或出现在响应；credentialRef 仅兼容已有部署配置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteNexusRepositoryRequest"
      responses:
        "200":
          description: 可迁移仓库索引
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteNexusRepositoryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: 上游 Nexus 不可达
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/migrations:
    get:
      operationId: listMigrations
      summary: 迁移任务列表（分页）
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTaskList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createMigration
      summary: 创建 planned 迁移任务（不自动执行）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMigrationRequest"
      responses:
        "201":
          description: 已创建 planned 任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/migrations/{id}:
    get:
      operationId: getMigration
      summary: 迁移任务详情
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/migrations/{id}/start:
    post:
      operationId: startMigration
      summary: 显式启动（planned → running）
      description: |
        可选 body.includeRepositories：启动前收窄 plan，仅迁移选中仓库（在线/离线均适用）。
        省略或空数组表示按当前 plan 全部仓库执行。
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartMigrationRequest"
      responses:
        "200":
          description: 已进入 running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/migrations/{id}/resume:
    post:
      operationId: resumeMigration
      summary: 自 failed/cancelled 断点续传
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      responses:
        "200":
          description: 已恢复 running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/migrations/{id}/cancel:
    post:
      operationId: cancelMigration
      summary: 取消 planned 或协作取消 running
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      responses:
        "200":
          description: 已取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/migrations/{id}/report:
    get:
      operationId: getMigrationReport
      summary: 迁移报告
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      responses:
        "200":
          description: 结构化报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/migrations/{id}/finalize:
    post:
      operationId: finalizeMigration
      summary: 切换窗口最终增量扫描（仅 completed）
      description: 对同一来源再枚举，仅复制目标不存在的路径；更新 report.delta。
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      responses:
        "200":
          description: 增量完成，返回任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/migrations/{id}/source-config:
    patch:
      operationId: updateMigrationSourceConfig
      summary: 修改迁移任务来源配置（仅非终态）
      description: |
        仅允许 planned 或 failed（失败待重试）状态的任务修改来源配置。
        当前仅支持更新 allowPrivateSource（是否允许私网/本机地址回源）。
        修改会持久化到任务 SourceConfig，之后可 start 或 resume 重试。
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowPrivateSource:
                  type: boolean
                  description: 来源是本机/内网地址时允许私网回源
              required:
                - allowPrivateSource
      responses:
        "200":
          description: 已更新来源配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/backups:
    get:
      operationId: listBackups
      summary: 备份包列表（分页，仅管理员）
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 备份包列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPackageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createBackup
      summary: 生成备份包（仅管理员）
      description: |
        hot：热备份，用 SQLite 一致性快照（VACUUM INTO）在不停服的前提下取快照。
        frozen：冻结窗口备份，另需先经 freeze 端点停写。
        包内只含 SQLite 快照与内容寻址 blob，不含任何密钥或节点本地配置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupRequest"
      responses:
        "201":
          description: 已登记并开始生成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPackage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/backups/{id}:
    get:
      operationId: getBackup
      summary: 备份包详情（仅管理员）
      parameters:
        - $ref: "#/components/parameters/BackupIdParam"
      responses:
        "200":
          description: 备份包详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPackage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBackup
      summary: 删除备份包（仅管理员）
      parameters:
        - $ref: "#/components/parameters/BackupIdParam"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/backups/{id}/download:
    get:
      operationId: downloadBackup
      summary: 下载备份包归档
      description: |
        通过 /link 取得带时效的签名地址后使用，此时不要求会话；
        已认证的管理员也可直接下载。签名令牌只对该包、该有效期有效。
      parameters:
        - $ref: "#/components/parameters/BackupIdParam"
        - name: token
          in: query
          required: false
          description: 签名令牌（由 /link 下发）。
          schema:
            type: string
        - name: exp
          in: query
          required: false
          description: 签名有效期截止（Unix 秒）。
          schema:
            type: string
      responses:
        "200":
          description: 备份包归档（tar.gz）
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/backups/{id}/link:
    post:
      operationId: createBackupLink
      summary: 生成带时效的下载链接（仅管理员）
      parameters:
        - $ref: "#/components/parameters/BackupIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupLinkRequest"
      responses:
        "200":
          description: 签名下载链接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/backups/{id}/verify:
    post:
      operationId: verifyBackup
      summary: 校验备份包完整性（仅管理员）
      parameters:
        - $ref: "#/components/parameters/BackupIdParam"
        - name: deep
          in: query
          required: false
          description: 为 true 时逐 blob 比对内容摘要（全量读取，耗时与包等大）。
          schema:
            type: boolean
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupVerification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: 包内容校验未通过
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupVerification"
  /api/v1/maintenance/freeze:
    get:
      operationId: getWriteFreezeState
      summary: 查询写入冻结状态（仅管理员）
      description: |
        冻结期间节点拒绝本地业务与管理写入，但放行：读方法、登录、本维护命名空间，
        以及备份导入/上传路径（否则冻结窗口内无法完成搬迁切换）。
      responses:
        "200":
          description: 当前冻结状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteFreezeState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: freezeWrites
      summary: 冻结节点写入（仅管理员）
      description: |
        搬迁切换用：冻结 → 生成差包/导入 → 起服 → 解冻。
        窗口必须有界：可给 until（绝对时间）或 ttlSeconds（相对秒数），两者都省略时用 ttlSeconds 默认 7200；
        上限 24 小时。故意不提供「无限期冻结」——忘记解冻会让服务退化成假死。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreezeWritesRequest"
      responses:
        "200":
          description: 冻结已生效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteFreezeState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: unfreezeWrites
      summary: 解冻节点写入（仅管理员）
      description: 幂等：未冻结时调用同样返回 200 与当前状态。
      responses:
        "200":
          description: 解冻后的状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteFreezeState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/backups/import:
    post:
      operationId: importBackupFromURL
      summary: 从 URL 拉取并导入备份包（仅管理员）
      description: |
        拉取 → 校验 → 合并 blob → 暂存 db → 写 restore.pending；**需重启服务后才生效**。
        仅接受 http/https；拒绝回环、私网、链路本地与云元数据地址，并在每次拨号时重新解析地址
        （防 DNS 重绑定）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupImportRequest"
      responses:
        "202":
          description: 已受理并开始拉取
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/backups/imports:
    get:
      operationId: listBackupImports
      summary: 导入记录列表（分页，仅管理员）
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 导入记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImportList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/backups/imports/{id}:
    get:
      operationId: getBackupImport
      summary: 导入记录详情（仅管理员）
      parameters:
        - $ref: "#/components/parameters/BackupImportIdParam"
      responses:
        "200":
          description: 导入记录详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/backups/uploads:
    post:
      operationId: createBackupUpload
      summary: 发起分片上传会话（仅管理员）
      description: |
        返回服务端决定的分片大小（chunkSize）；前端据此切分。支持续传：会话以磁盘上真实存在的
        分片为准，缺哪片补哪片，重复片幂等覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupUploadRequest"
      responses:
        "201":
          description: 已创建上传会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupUploadSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/backups/uploads/{id}/chunks/{index}:
    put:
      operationId: uploadBackupChunk
      summary: 上传单个分片（仅管理员）
      description: |
        请求体为原始分片字节（application/octet-stream）。分片大小必须 > 0 且 <= 服务端 chunkSize；
        序号越界、累计超额、终态会话均被拒。成功返回当前会话（含已落盘分片），便于前端更新进度。
      parameters:
        - $ref: "#/components/parameters/BackupUploadIdParam"
        - $ref: "#/components/parameters/BackupUploadChunkIndexParam"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 已接收分片
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupUploadSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/backups/uploads/{id}:
    get:
      operationId: getBackupUpload
      summary: 查询上传会话（续传用，仅管理员）
      parameters:
        - $ref: "#/components/parameters/BackupUploadIdParam"
      responses:
        "200":
          description: 上传会话（含已落盘分片序号）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupUploadSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/backups/uploads/{id}/complete:
    post:
      operationId: completeBackupUpload
      summary: 拼装并触发本地导入（仅管理员）
      description: |
        校验分片齐全后按序拼成归档并核对摘要，再交给本地导入状态机（queued → staging → pending_restart）。
        需重启服务才生效。目标非空需 overwrite=true。
      parameters:
        - $ref: "#/components/parameters/BackupUploadIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteBackupUploadRequest"
      responses:
        "202":
          description: 已受理并开始导入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/backups/uploads/{id}/abort:
    post:
      operationId: abortBackupUpload
      summary: 取消上传会话（仅管理员）
      parameters:
        - $ref: "#/components/parameters/BackupUploadIdParam"
      responses:
        "204":
          description: 已取消并清理磁盘
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TokenIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RepoNameParam:
      name: name
      in: path
      required: true
      schema:
        type: string
    MigrationIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PrefixParam:
      name: prefix
      in: query
      required: false
      description: 按制品路径前缀过滤
      schema:
        type: string
    AuditFromParam:
      name: from
      in: query
      required: false
      description: |
        UTC 时间范围下界（含）。与 `to` 同时提供或同时省略；省略时服务端使用最近 24 小时。
      schema:
        type: string
        format: date-time
    AuditToParam:
      name: to
      in: query
      required: false
      description: |
        UTC 时间范围上界（不含）。与 `from` 同时提供或同时省略；范围最长 30 天。
      schema:
        type: string
        format: date-time
    AuditCategoryParam:
      name: category
      in: query
      required: false
      description: 按固定审计分类筛选；可重复传入多个值。
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/components/schemas/AuditCategory"
    AuditResultParam:
      name: result
      in: query
      required: false
      description: 按服务端归一化结果筛选；可重复传入多个值。
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/components/schemas/AuditResult"
    AuditActorParam:
      name: actor
      in: query
      required: false
      description: 按审计身份快照的显示名称精确筛选。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuditRepositoryParam:
      name: repository
      in: query
      required: false
      description: 按安全展示的仓库名称精确筛选。
      schema:
        type: string
        minLength: 1
        maxLength: 255
    AuditQueryParam:
      name: q
      in: query
      required: false
      description: |
        关键字：服务端按事件 ID、动作、摘要、目标路径与操作者邮箱匹配（不区分大小写）。
      schema:
        type: string
        minLength: 1
        maxLength: 256
    AuditAttentionParam:
      name: attention
      in: query
      required: false
      description: 按风险批次状态筛选：pending（未确认）/ acknowledged（已确认）。
      schema:
        type: string
        enum: [pending, acknowledged]
    AuditMethodParam:
      name: method
      in: query
      required: false
      description: 按 HTTP 请求方法筛选。
      schema:
        type: string
        enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
    AuditActionParam:
      name: action
      in: query
      required: false
      description: 按服务端映射的操作名称精确筛选。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuditActorEmailParam:
      name: actorEmail
      in: query
      required: false
      description: 按操作者邮箱精确筛选（记录时固化的身份快照）。
      schema:
        type: string
        minLength: 1
        maxLength: 256
    AuditClientIpParam:
      name: clientIp
      in: query
      required: false
      description: 按客户端 IP 前缀筛选。
      schema:
        type: string
        minLength: 1
        maxLength: 64
    AuditAuthSourceParam:
      name: authSource
      in: query
      required: false
      description: 按认证方式筛选（如 jwt、api_key、web）。
      schema:
        type: string
        minLength: 1
        maxLength: 64
    AuditOffsetParam:
      name: offset
      in: query
      required: false
      description: 显式偏移量（分页器直达指定页，优先于 cursor）。
      schema:
        type: integer
        minimum: 0

    AuditSnapshotParam:
      name: snapshot
      in: query
      required: false
      description: 从审计概览取得的不透明稳定读取边界；不得解析或改写。
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    AuditCursorParam:
      name: cursor
      in: query
      required: false
      description: 从上一页响应取得的不透明游标；不得解析或改写。
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    AuditLimitParam:
      name: limit
      in: query
      required: false
      description: 单页安全事件数量。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    AuditNotificationStatusParam:
      name: status
      in: query
      required: false
      description: |
        按批次确认状态筛选。`unacknowledged`（缺省）仅返回仍有未确认风险来源的批次；
        `acknowledged` 仅返回全部风险来源均已确认的批次；`all` 不筛选确认状态。
      schema:
        $ref: "#/components/schemas/AuditNotificationStatus"
    AuditNotificationLimitParam:
      name: limit
      in: query
      required: false
      description: 单页通知批次数数量。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AuditEventIdParam:
      name: eventId
      in: path
      required: true
      description: 当前节点统一审计事件的不透明服务端标识。
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    AuditAttentionIdParam:
      name: attentionId
      in: path
      required: true
      description: 当前节点风险关注批次的不透明服务端标识。
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    ObservabilityFromParam:
      name: from
      in: query
      required: false
      description: UTC 时间范围下界（含）。与 to 同时提供或同时省略；省略时为最近 24 小时。
      schema:
        type: string
        format: date-time
    ObservabilityToParam:
      name: to
      in: query
      required: false
      description: UTC 时间范围上界（不含），最长 30 天。
      schema:
        type: string
        format: date-time
    BackupIdParam:
      name: id
      in: path
      required: true
      description: 备份包标识（形如 bk-20260910-162701-a1b2c3）。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    BackupImportIdParam:
      name: id
      in: path
      required: true
      description: 导入记录标识。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    BackupUploadIdParam:
      name: id
      in: path
      required: true
      description: 分片上传会话标识（形如 up-20260910-162701-a1b2c3）。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    BackupUploadChunkIndexParam:
      name: index
      in: path
      required: true
      description: 分片序号，从 0 开始。
      schema:
        type: integer
        minimum: 0
        maximum: 100000000
  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 越权
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AssetOperationBadRequest:
      description: 统一制品操作请求错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssetOperationError"
    AssetOperationUnauthorized:
      description: 统一制品操作未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssetOperationError"
    AssetOperationForbidden:
      description: 统一制品操作越权
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssetOperationError"
    AssetOperationNotFound:
      description: 统一制品操作目标不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssetOperationError"
    AssetOperationConflict:
      description: 统一制品操作冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssetOperationError"
    AssetOperationInternalError:
      description: 统一制品操作内部失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AssetOperationError"
  schemas:
    ClusterSyncEvent:
      type: object
      description: 当前节点的一次安全同步诊断事件；不含来源地址、令牌或原始错误。
      required:
        [
          eventId,
          triggerType,
          actorUsername,
          actorAuthSource,
          direction,
          startedAt,
          result,
          fromSeq,
          toSeq,
          observedPrimarySeq,
          changes,
          applied,
          failed,
          blobs,
          stage,
          errorCode,
          errorSummary,
          recoveryHint,
        ]
      properties:
        eventId: { type: string, minLength: 1, maxLength: 128 }
        triggerType:
          type: string
          enum: [automatic, manual, recovery]
          x-enum-varnames:
            [ClusterSyncTriggerAutomatic, ClusterSyncTriggerManual, ClusterSyncTriggerRecovery]
        actorUsername: { type: string, minLength: 1, maxLength: 128 }
        actorUserId: { type: integer, format: int64, minimum: 1 }
        actorAuthSource: { type: string, minLength: 1, maxLength: 64 }
        direction:
          type: string
          enum: [primary_to_current_standby, parent_to_current, current_to_child]
          x-enum-varnames:
            [
              ClusterSyncDirectionPrimaryToStandby,
              ClusterSyncDirectionParentToCurrent,
              ClusterSyncDirectionCurrentToChild,
            ]
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        result:
          type: string
          enum: [running, success, failure]
          x-enum-varnames:
            [ClusterSyncResultRunning, ClusterSyncResultSuccess, ClusterSyncResultFailure]
        fromSeq: { type: integer, format: int64, minimum: 0 }
        toSeq: { type: integer, format: int64, minimum: 0 }
        observedPrimarySeq: { type: integer, format: int64, minimum: 0 }
        changes: { type: integer, minimum: 0 }
        applied: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        blobs: { type: integer, minimum: 0 }
        stage: { type: string, maxLength: 64 }
        errorCode: { type: string, maxLength: 128 }
        errorSummary: { type: string, maxLength: 512 }
        recoveryHint: { type: string, maxLength: 512 }
    ClusterSyncEventPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ClusterSyncEvent" }
        total: { type: integer, minimum: 0 }
    ClusterSyncChange:
      type: object
      description: 同步关联变更的安全摘要；不返回复制原始数据。
      required: [seq, op, entityType, target, occurredAt]
      properties:
        seq: { type: integer, format: int64, minimum: 0 }
        op:
          type: string
          enum: [put, delete]
          x-enum-varnames: [ClusterSyncChangePut, ClusterSyncChangeDelete]
        entityType: { type: string, minLength: 1, maxLength: 64 }
        target: { type: string, minLength: 1, maxLength: 256 }
        occurredAt: { type: string, format: date-time }
    ClusterSyncChangePage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ClusterSyncChange" }
        total: { type: integer, minimum: 0 }
    ClusterNeighbor:
      type: object
      description: 当前节点与一个直接邻接节点之间的复制边状态；不表示全局拓扑。
      required:
        [
          edgeId,
          relation,
          nodeId,
          relayEnabled,
          state,
          stateReason,
          direction,
          watermark,
          hasWatermark,
          pending,
          readyRecords,
          pendingRecords,
        ]
      properties:
        edgeId: { type: string, minLength: 1, maxLength: 128 }
        relation:
          type: string
          enum: [parent, child]
          x-enum-varnames: [ClusterNeighborRelationParent, ClusterNeighborRelationChild]
        nodeId: { type: string, minLength: 1, maxLength: 128 }
        relayEnabled: { type: boolean }
        state:
          type: string
          enum:
            [disabled, not_applicable, unpaired, paused, syncing, failed, stale, healthy, unknown]
          x-enum-varnames:
            [
              ClusterNeighborStateDisabled,
              ClusterNeighborStateNotApplicable,
              ClusterNeighborStateUnpaired,
              ClusterNeighborStatePaused,
              ClusterNeighborStateSyncing,
              ClusterNeighborStateFailed,
              ClusterNeighborStateStale,
              ClusterNeighborStateHealthy,
              ClusterNeighborStateUnknown,
            ]
        stateReason: { type: string, minLength: 1, maxLength: 512 }
        direction:
          type: string
