# JianArtifact API 契约 —— 唯一真源（设计优先，见 docs/adr/0004-design-first-openapi.md）。
# 变更此文件后运行 `task gen` 重生成 Go 接口与类型；生成产物不得手改。
# 0.4.0：Nexus 迁移管理面（discover / planned / start / resume / report）。
openapi: 3.0.3
info:
  title: JianArtifact API
  version: 0.4.0
  description: 自托管多格式制品仓库的管理 API。协议端点（Raw/Maven/npm 等原生客户端交互）以协议兼容测试保障，不在此契约内描述。
  license:
    name: MIT
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 存活探针
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadyz
      summary: 就绪探针（SQLite + blob 目录自检通过后才返回 200）
      security: []
      responses:
        "200":
          description: 已就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: 未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/status:
    get:
      operationId: getStatus
      summary: 运行时状态（版本、就绪、迁移版本、初始化标志、用户数）
      security: []
      responses:
        "200":
          description: 状态信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusInfo"
  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrap
      summary: 首启管理员自举（仅在未初始化，即 user 表为空时可用）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: 首个管理员创建成功，返回会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 实例已初始化，自举关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 用户名 + 口令换取会话 JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 注销当前会话（当前 JWT 记入吊销名单直至过期）
      responses:
        "204":
          description: 已注销
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: 用户列表（分页）
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/users/{id}:
    patch:
      operationId: updateUser
      summary: 更新用户（角色 / 状态）
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUser
      summary: 删除用户
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{id}/password:
    post:
      operationId: changePassword
      summary: 修改 / 重置用户口令
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: 已修改
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tokens:
    get:
      operationId: listTokens
      summary: 当前用户的 API Token 列表（不含明文）
      responses:
        "200":
          description: 令牌列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createToken
      summary: 签发 API Token（明文仅此次返回一次）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: 已签发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/tokens/{id}:
    delete:
      operationId: deleteToken
      summary: 吊销 API Token
      parameters:
        - $ref: "#/components/parameters/TokenIdParam"
      responses:
        "204":
          description: 已吊销
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/repositories:
    get:
      operationId: listRepositories
      summary: 仓库列表（分页，按可见性 / ACL 过滤）
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 仓库列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRepository
      summary: 创建仓库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepositoryRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/repositories/{name}:
    patch:
      operationId: updateRepository
      summary: 更新仓库（可见性 / 配置）
      parameters:
        - $ref: "#/components/parameters/RepoNameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepositoryRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRepository
      summary: 删除仓库
      parameters:
        - $ref: "#/components/parameters/RepoNameParam"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/repositories/{name}/acl:
    get:
      operationId: getRepositoryAcl
      summary: 读取仓库 ACL
      parameters:
        - $ref: "#/components/parameters/RepoNameParam"
      responses:
        "200":
          description: ACL 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AclList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setRepositoryAcl
      summary: 覆盖写入仓库 ACL
      parameters:
        - $ref: "#/components/parameters/RepoNameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAclRequest"
      responses:
        "200":
          description: 已写入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AclList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/repositories/{name}/assets:
    get:
      operationId: listRepositoryAssets
      summary: 列出仓库制品（分页，可按路径前缀过滤）
      parameters:
        - $ref: "#/components/parameters/RepoNameParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/PrefixParam"
      responses:
        "200":
          description: 制品列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/repositories/{name}/usage:
    get:
      operationId: getRepositoryUsage
      summary: 仓库客户端使用片段（据 format/type 返回接入命令）
      parameters:
        - $ref: "#/components/parameters/RepoNameParam"
      responses:
        "200":
          description: 使用片段
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/migrations/discover:
    post:
      operationId: discoverMigrations
      summary: 三来源发现并落库为 planned 任务（不同步执行）
      description: |
        同步执行发现；成功写入一条 status=planned 的 migration_task，返回 taskId 与 plan。
        失败不落库。真正搬运须 POST /migrations/{id}/start。仅 admin。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationDiscoverRequest"
      responses:
        "200":
          description: 发现成功并已落库 planned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationDiscoverResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: 上游 Nexus 不可达
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/migrations:
    get:
      operationId: listMigrations
      summary: 迁移任务列表（分页）
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTaskList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createMigration
      summary: 创建 planned 迁移任务（不自动执行）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMigrationRequest"
      responses:
        "201":
          description: 已创建 planned 任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/migrations/{id}:
    get:
      operationId: getMigration
      summary: 迁移任务详情
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/migrations/{id}/start:
    post:
      operationId: startMigration
      summary: 显式启动（planned → running）
      description: |
        可选 body.includeRepositories：启动前收窄 plan，仅迁移选中仓库（在线/离线均适用）。
        省略或空数组表示按当前 plan 全部仓库执行。
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartMigrationRequest"
      responses:
        "200":
          description: 已进入 running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/migrations/{id}/resume:
    post:
      operationId: resumeMigration
      summary: 自 failed/cancelled 断点续传
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      responses:
        "200":
          description: 已恢复 running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/migrations/{id}/cancel:
    post:
      operationId: cancelMigration
      summary: 取消 planned 或协作取消 running
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      responses:
        "200":
          description: 已取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/migrations/{id}/report:
    get:
      operationId: getMigrationReport
      summary: 迁移报告
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      responses:
        "200":
          description: 结构化报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/migrations/{id}/finalize:
    post:
      operationId: finalizeMigration
      summary: 切换窗口最终增量扫描（仅 completed）
      description: 对同一来源再枚举，仅复制目标不存在的路径；更新 report.delta。
      parameters:
        - $ref: "#/components/parameters/MigrationIdParam"
      responses:
        "200":
          description: 增量完成，返回任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TokenIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RepoNameParam:
      name: name
      in: path
      required: true
      schema:
        type: string
    MigrationIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PrefixParam:
      name: prefix
      in: query
      required: false
      description: 按制品路径前缀过滤
      schema:
        type: string
  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 越权
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        version:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    StatusInfo:
      type: object
      required: [version, ready, initialized, migrationVersion, userCount]
      properties:
        version:
          type: string
        ready:
          type: boolean
        initialized:
          type: boolean
        migrationVersion:
          type: string
        userCount:
          type: integer
    BootstrapRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, username, role, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          type: string
    UserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, user]
          default: user
    UpdateUserRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
    PasswordChangeRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
    Token:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    TokenCreated:
      type: object
      required: [id, name, token, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        token:
          type: string
          description: 明文令牌，仅此次返回一次。
