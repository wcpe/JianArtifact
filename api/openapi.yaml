              metadata_applied_pending_blob,
              lww_skipped,
              pending_parent,
              blob_failed,
              skipped_permanent,
              failed,
            ]
          x-enum-varnames:
            [
              StandbySyncApplyLogApplied,
              StandbySyncApplyLogMetadataAppliedPendingBlob,
              StandbySyncApplyLogLwwSkipped,
              StandbySyncApplyLogPendingParent,
              StandbySyncApplyLogBlobFailed,
              StandbySyncApplyLogSkippedPermanent,
              StandbySyncApplyLogFailed,
            ]
        detail: { type: string, maxLength: 256 }
        lastError: { type: string, maxLength: 256 }
        lastErrorAt: { type: string }
        firstSeenAt: { type: string }
        lastSeenAt: { type: string }
        attemptCount: { type: integer, minimum: 0 }
