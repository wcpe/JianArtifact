    StandbySyncReport:
      type: object
      description: |
        FR-119：primary 经现有复制互信通道（仅 GET 拉取）收到的备用节点观测快照聚合。
        仅 role=primary 且至少收到一次上报时返回；不含凭据、令牌、环境变量或对端地址。
      required: [nodeId, lastReportAt, fresh, watermark, hasWatermark, applyLogs, syncEvents]
      properties:
        nodeId:
          type: string
          description: 备用节点稳定 ID；取自鉴权请求头，不信任快照内自报身份。
          minLength: 1
          maxLength: 128
        lastReportAt:
          type: string
          format: date-time
          description: primary 收到最近一次快照的时间。
        fresh:
          type: boolean
          description: 服务端判定最近上报是否新鲜（距 lastReportAt 未超过 3 个有效同步间隔）；前端不得自行计算。
        watermark: { type: integer, format: int64, minimum: 0 }
        hasWatermark: { type: boolean }
        applyLogs:
          type: array
          description: 备用节点最近上报的复制接收审计窗口（按最近看到时间倒序，最多 15 条）。
          items: { $ref: "#/components/schemas/StandbySyncApplyLog" }
        syncEvents:
          type: array
          description: 备用节点最近上报的同步事件窗口（按开始时间倒序，最多 15 条）。
          items: { $ref: "#/components/schemas/ClusterSyncEvent" }
