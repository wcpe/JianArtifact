          firstSeenAt,
          lastSeenAt,
          attemptCount,
        ]
      properties:
        sourceNode: { type: string }
        sourceSeq: { type: integer, format: int64, minimum: 0 }
        sourceActor: { type: string }
        sourceAuthSource: { type: string }
        operationId: { type: string }
        entityType: { type: string }
        entityKey: { type: string, maxLength: 256 }
        op: { type: string }
        result:
          type: string
          enum:
            [
