          enum: [repository, artifact, user, token, acl, setting, migration, cluster, other]
          x-enum-varnames:
            [
              AuditTargetRepository,
              AuditTargetArtifact,
              AuditTargetUser,
              AuditTargetToken,
              AuditTargetAcl,
              AuditTargetSetting,
              AuditTargetMigration,
              AuditTargetCluster,
              AuditTargetOther,
            ]
        label:
          type: string
          minLength: 1
          maxLength: 512
        repository:
          type: string
          minLength: 1
          maxLength: 255
    AuditActorSnapshot:
      type: object
      description: |
        记录时固化的安全身份快照。用户名、认证来源和可选用户 ID 均不依赖用户当前是否仍存在；
        不包含令牌标识或认证材料。
      required: [displayName, subjectType, authSource]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        subjectType:
          type: string
          enum: [user, system, anonymous, replication]
          x-enum-varnames:
            [AuditActorUser, AuditActorSystem, AuditActorAnonymous, AuditActorReplication]
        userId:
          type: integer
          format: int64
          minimum: 1
        authSource:
          type: string
          minLength: 1
          maxLength: 64
        email:
          type: string
          description: 记录时固化的操作者邮箱（若账号已绑定），用于审计检索与人工对照。
          minLength: 1
          maxLength: 256
    AuditAcknowledgement:
      type: object
      description: |
        最先成功确认时固化的管理员身份和时间。该快照不因确认人随后被删除而变化，也不参与节点复制。
      required: [acknowledgedBy, acknowledgedAt]
      properties:
        acknowledgedBy:
          $ref: "#/components/schemas/AuditActorSnapshot"
        acknowledgedAt:
          type: string
          format: date-time
    AuditEventAttention:
      type: object
      description: 单条风险事件在其服务端风险关注批次中的确认状态。
      required: [attentionId, state]
      properties:
        attentionId:
          type: string
          description: 服务端签发的不透明风险关注批次标识，客户端不得解析或拼装。
          minLength: 1
          maxLength: 2048
        state:
          $ref: "#/components/schemas/AuditAttentionState"
        acknowledgement:
          $ref: "#/components/schemas/AuditAcknowledgement"
    AuditEvent:
      type: object
      description: |
        当前节点统一审计事件的安全展示字段。客户端 IP 仅在管理员审计视图按策略返回（可关闭）；
        顶层不得返回 User-Agent、请求标识、原始响应体、内部地址、令牌标识或任何凭据——
        它们只允许出现在脱敏后的 http 子对象（AuditHttpContext）内，其中请求头仅保留
        白名单常用头且已剔除 Authorization 等敏感头；durationServerMs 只是耗时度量，不承载请求内容。
      required: [eventId, occurredAt, category, severity, result, action, target, actor, summary]
      properties:
        eventId:
          type: string
          description: 服务端签发的不透明事件标识，客户端不得解析或拼装。
          minLength: 1
          maxLength: 2048
        occurredAt:
          type: string
          format: date-time
        category:
          $ref: "#/components/schemas/AuditCategory"
        severity:
          $ref: "#/components/schemas/AuditSeverity"
        result:
          $ref: "#/components/schemas/AuditResult"
        action:
          type: string
          description: 服务端映射的稳定操作名称。
          minLength: 1
          maxLength: 128
        target:
          $ref: "#/components/schemas/AuditTarget"
        actor:
          $ref: "#/components/schemas/AuditActorSnapshot"
        summary:
          type: string
          description: 服务端脱敏的可行动摘要。
          minLength: 1
          maxLength: 512
        operationId:
          type: string
          description: 可选的本节点操作关联标识；仅供管理员跨节点人工对照，不表示远端已应用。
          minLength: 1
          maxLength: 255
        attention:
          $ref: "#/components/schemas/AuditEventAttention"
        http:
          $ref: "#/components/schemas/AuditHttpContext"
        durationMs:
          type: integer
          format: int64
          description: 服务端处理耗时（毫秒）。
          minimum: 0
        # 单段耗时与 durationMs 的区别：不含全局中间件前置开销，起点在契约路由链首。
        durationServerMs:
          type: integer
          format: int64
          description: |
            单段服务端耗时（毫秒）：进入业务路由处理到审计落笔；
            未进入契约路由（协议端点、静态回退或被全局中间件直接拒绝）为 0，缺省不返回。
          minimum: 0
        clientIp:
          type: string
          description: |
            发起请求的客户端 IP。仅管理员审计视图按策略返回（可配置关闭），
            不得用于凭据用途，也不得在复制/导出通道外传播。
          minLength: 1
          maxLength: 64
    AuditHttpContext:
      type: object
      description: |
        脱敏后的 HTTP 上下文：请求方法、归一化路由模板、响应状态码与排障辅助信息。
        路径为路由模板（如 /api/v1/admin/accounts/{id}），不含查询串或内部地址。
        请求体与令牌预览必须脱敏（掩码/截断），不得出现凭据原文。
      required: [method, path]
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        path:
          type: string
          minLength: 1
          maxLength: 512
        statusCode:
          type: integer
          description: HTTP 响应状态码。
          minimum: 100
          maximum: 599
        requestId:
          type: string
          description: 服务端请求标识（可用于工单/日志对照，不承载鉴权语义）。
          minLength: 1
          maxLength: 128
        userAgent:
          type: string
          description: 客户端 User-Agent 原文（仅管理员审计视图返回）。
          minLength: 1
          maxLength: 512
        tokenPreview:
          type: string
          description: 认证令牌的脱敏预览（形如 Bearer eyJhbG****1dnM）。
          minLength: 1
          maxLength: 128
        bodyPreview:
          type: string
          description: |
            脱敏后的请求体（JSON 文本，敏感字段已掩码）。
            仅管理员审计视图返回，不得包含凭据、令牌或个人信息原文。
          maxLength: 4096
        # 仅捕获白名单内常用协商/溯源头；Authorization 等敏感头既不在白名单、
        # 也由敏感键名单二次拦截，绝不入列；单头值按字符截断到 256。
        httpHeaders:
          type: string
          description: |
            常用白名单请求头的紧凑 JSON 文本（如 {"Accept":"application/json"}）。
            已剔除 Authorization 等敏感头，单个头值截断 256 字符；Referer 仅保留
            scheme/host/path，剔除 userinfo、query 与 fragment；未捕获到白名单头（或该列未读取）时缺省。
          maxLength: 8192
    AuditEventSafeDetails:
      type: object
      description: |
        事件详情允许扩展的脱敏字段。不得回显原始 detail、堆栈、原始响应体、内部地址、
        请求标识、IP、User-Agent 或任何凭据。
      required: [resultSummary, affectedCount]
      properties:
        resultSummary:
          type: string
          minLength: 1
          maxLength: 1024
        errorClass:
          type: string
          description: 服务端归一化错误分类，不包含原始错误文本。
          minLength: 1
          maxLength: 128
        affectedCount:
          type: integer
          minimum: 0
    AuditEventDetail:
      type: object
      description: 当前节点统一审计事件详情；只返回安全字段。
      required: [event, details]
      properties:
        event:
          $ref: "#/components/schemas/AuditEvent"
        details:
          $ref: "#/components/schemas/AuditEventSafeDetails"
    AuditCategoryCount:
      type: object
      required: [category, count]
      properties:
        category:
          $ref: "#/components/schemas/AuditCategory"
        count:
          type: integer
          minimum: 0
    AuditTrendPoint:
      type: object
      required: [from, to, totalCount, failureCount, categoryCounts]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        totalCount:
          type: integer
          minimum: 0
        failureCount:
          type: integer
          minimum: 0
        categoryCounts:
          type: array
          items:
            $ref: "#/components/schemas/AuditCategoryCount"
    AuditObservabilitySummary:
      type: object
      description: 当前节点统一审计的筛选范围概览和稳定读取边界。
      required:
        [
          snapshot,
          snapshotAt,
          totalCount,
          successCount,
          failureCount,
          failureRate,
          distinctActorCount,
          highRiskCount,
          categoryCounts,
          trend,
        ]
      properties:
        snapshot:
          type: string
          description: 服务端签发的不透明稳定读取边界；不得解析、修改或跨筛选条件复用。
          minLength: 1
          maxLength: 2048
        snapshotAt:
          type: string
          format: date-time
        totalCount:
          type: integer
          minimum: 0
        successCount:
          type: integer
          minimum: 0
        failureCount:
          type: integer
          minimum: 0
        failureRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 最终结果为成功或失败的事件中，失败事件所占比例。
        distinctActorCount:
          type: integer
          minimum: 0
          description: 仅按稳定用户 ID 或非空身份快照去重的账号数；系统、匿名和复制来源不计入。
        distinctClientIpCount:
          type: integer
          minimum: 0
          description: 客户端 IP 去重数量（客户端 IP 按策略可用时统计，否则为 0）。
        averageDurationMs:
          type: integer
          format: int64
          minimum: 0
          description: 平均处理耗时（毫秒；无样本时为 0）。
        slowRequestCount:
          type: integer
          minimum: 0
          description: 慢请求数（处理耗时 ≥ 阈值，默认 1000ms）。
        clientErrorCount:
          type: integer
          minimum: 0
          description: 4xx 客户端错误数。
        serverErrorCount:
          type: integer
          minimum: 0
          description: 5xx 服务端错误数。
        highRiskCount:
          type: integer
          minimum: 0
        categoryCounts:
          type: array
          items:
            $ref: "#/components/schemas/AuditCategoryCount"
        trend:
          type: array
          description: 服务端按范围固定粒度返回的趋势桶。
          items:
            $ref: "#/components/schemas/AuditTrendPoint"
    AuditEventPage:
      type: object
      required: [items, totalCount, snapshot, snapshotAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        totalCount:
          type: integer
          description: |-
            命中总数。-1 表示服务端未执行精确 COUNT（取消全量计数以保障首屏性能），
            此时客户端应展示「已加载 N 条」，不得当作 0 或错误处理。
        nextCursor:
          type: string
          description: 下一页的不透明游标；没有下一页时省略。
          minLength: 1
          maxLength: 2048
        snapshot:
          type: string
          description: 与审计概览和同筛选事件页共享的不透明稳定读取边界。
          minLength: 1
          maxLength: 2048
        snapshotAt:
          type: string
          format: date-time
    AuditAttentionPage:
      type: object
      description: 与审计概览和原始事件共享稳定快照的服务端风险关注批次分页。
      required: [items, totalCount, snapshot, snapshotAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditAttention"
        totalCount:
          type: integer
          minimum: 0
        nextCursor:
          type: string
          description: 下一页不透明游标；没有下一页时省略。
          minLength: 1
          maxLength: 2048
        snapshot:
          type: string
          description: 与审计概览和原始事件共享的不透明稳定读取边界。
          minLength: 1
          maxLength: 2048
        snapshotAt:
          type: string
          format: date-time
    AuditAttentionPreview:
      type: object
      description: |
        当前节点风险关注批次的安全摘要。该批次由服务端定义；客户端不得按操作、时间桶或事件列表
        自行构造确认边界。
      required:
        [
          attentionId,
          state,
          categoryCounts,
          severity,
          firstOccurredAt,
          latestOccurredAt,
          result,
          action,
          target,
          summary,
          successCount,
          failureCount,
          affectedCount,
          unacknowledgedRiskEventCount,
        ]
      properties:
        attentionId:
          type: string
          description: 服务端签发的不透明风险关注批次标识，客户端不得解析或拼装。
          minLength: 1
          maxLength: 2048
        state:
          $ref: "#/components/schemas/AuditAttentionState"
        categoryCounts:
          type: array
          description: 批次成员按固定审计分类汇总；至少包含一个分类，按审计分类枚举顺序返回。
          minItems: 1
          items:
            $ref: "#/components/schemas/AuditCategoryCount"
        severity:
          $ref: "#/components/schemas/AuditSeverity"
        firstOccurredAt:
          type: string
          format: date-time
        latestOccurredAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/AuditAttentionResult"
        action:
          type: string
          description: 服务端按失败、严重性、发生时间和稳定事件标识优先级选出的风险批次主要操作名称。
          minLength: 1
          maxLength: 128
        target:
          $ref: "#/components/schemas/AuditTarget"
        summary:
          type: string
          description: 服务端脱敏的可行动摘要。
          minLength: 1
          maxLength: 512
        successCount:
          type: integer
          minimum: 0
        failureCount:
          type: integer
          minimum: 0
        affectedCount:
          type: integer
          minimum: 0
        unacknowledgedRiskEventCount:
          type: integer
          minimum: 0
        operationId:
          type: string
          description: 可选的本节点操作关联标识；仅供管理员跨节点人工对照，不表示远端已应用。
          minLength: 1
          maxLength: 255
        firstAcknowledgement:
          $ref: "#/components/schemas/AuditAcknowledgement"
    AuditAttention:
      allOf:
        - $ref: "#/components/schemas/AuditAttentionPreview"
        - type: object
          required: [riskEventCount, acknowledgedRiskEventCount]
          properties:
            riskEventCount:
              type: integer
              minimum: 0
            acknowledgedRiskEventCount:
              type: integer
              minimum: 0
    AuditAttentionDetail:
      type: object
      description: 当前节点风险关注批次详情和安全成员分页。
      required: [attention, items, totalCount]
      properties:
        attention:
          $ref: "#/components/schemas/AuditAttention"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        totalCount:
          type: integer
          minimum: 0
        nextCursor:
          type: string
          description: 下一页的不透明游标；没有下一页时省略。
          minLength: 1
          maxLength: 2048
    AcknowledgeAuditAttentionRequest:
      type: object
      description: |
        只接受服务端签发的风险关注批次标识；身份从当前会话取得，客户端不得提交确认人、时间或成员事件。
      required: [attentionId]
      properties:
        attentionId:
          type: string
          minLength: 1
          maxLength: 2048
    AcknowledgeAuditAttentionResponse:
      type: object
      description: |
        原子确认结果。重复或并发请求返回同一批次最先成功的确认身份快照和时间；
        `newlyAcknowledgedCount` 为本请求实际新增确认的风险事件数。
      required:
        [
          attentionId,
          firstAcknowledgement,
          totalRiskEventCount,
          newlyAcknowledgedCount,
          unacknowledgedRiskEventCount,
        ]
      properties:
        attentionId:
          type: string
          minLength: 1
          maxLength: 2048
        firstAcknowledgement:
          $ref: "#/components/schemas/AuditAcknowledgement"
        totalRiskEventCount:
          type: integer
          minimum: 0
          description: attentionId 绑定快照内风险成员总数，不受本次是否重复确认影响。
        newlyAcknowledgedCount:
          type: integer
          minimum: 0
        unacknowledgedRiskEventCount:
          type: integer
          minimum: 0
    AuditAttentionNotificationList:
      type: object
      description: |
        当前节点风险通知批次分页。缺省请求（未携带任何筛选参数）保持页眉通知口径：最近 24 小时、
        仅未确认批次、失败优先排序、最多 20 条预览，并返回 `totalUnacknowledged`（等于该请求下的
        `total`）供页眉徽标使用；携带 `from`/`to`/`status`/`limit`/`cursor` 时返回与 `status`
        同口径的分页列表（时间排序），`items` 可包含已确认批次。
      required: [items, total, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AuditAttentionPreview"
        total:
          type: integer
          minimum: 0
          description: 与请求 `status` 筛选同口径的通知批次总数（分页权威总数）。
        totalUnacknowledged:
          type: integer
          minimum: 0
          description: |
            最近 24 小时未确认风险批次总数（页眉徽标口径）。仅缺省请求返回，
            与缺省请求下的 `total` 相等；保留该字段是为了兼容既有页眉客户端。
        hasMore:
          type: boolean
          description: 是否还有下一页；由 `limit` 与匹配总数决定。
        nextCursor:
          type: string
          description: 下一页的不透明游标；没有下一页时省略。
          minLength: 1
          maxLength: 2048
    StatusInfo:
