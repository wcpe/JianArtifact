          minimum: 0
          description: 仅按稳定用户 ID 或非空身份快照去重的账号数；系统、匿名和复制来源不计入。
        distinctClientIpCount:
          type: integer
          minimum: 0
          description: 客户端 IP 去重数量（客户端 IP 按策略可用时统计，否则为 0）。
        averageDurationMs:
          type: integer
          format: int64
          minimum: 0
          description: 平均处理耗时（毫秒；无样本时为 0）。
        slowRequestCount:
          type: integer
          minimum: 0
          description: 慢请求数（处理耗时 ≥ 阈值，默认 1000ms）。
        clientErrorCount:
          type: integer
          minimum: 0
          description: 4xx 客户端错误数。
        serverErrorCount:
          type: integer
          minimum: 0
          description: 5xx 服务端错误数。
        highRiskCount:
          type: integer
          minimum: 0
        categoryCounts:
          type: array
          items:
            $ref: "#/components/schemas/AuditCategoryCount"
        trend:
          type: array
          description: 服务端按范围固定粒度返回的趋势桶。
          items:
            $ref: "#/components/schemas/AuditTrendPoint"
    AuditEventPage:
      type: object
      required: [items, totalCount, snapshot, snapshotAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        totalCount:
          type: integer
          minimum: 0
        nextCursor:
          type: string
          description: 下一页的不透明游标；没有下一页时省略。
          minLength: 1
          maxLength: 2048
        snapshot:
          type: string
          description: 与审计概览和同筛选事件页共享的不透明稳定读取边界。
          minLength: 1
          maxLength: 2048
        snapshotAt:
          type: string
          format: date-time
    AuditAttentionPage:
      type: object
      description: 与审计概览和原始事件共享稳定快照的服务端风险关注批次分页。
      required: [items, totalCount, snapshot, snapshotAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditAttention"
        totalCount:
          type: integer
          minimum: 0
        nextCursor:
          type: string
          description: 下一页不透明游标；没有下一页时省略。
          minLength: 1
          maxLength: 2048
        snapshot:
          type: string
          description: 与审计概览和原始事件共享的不透明稳定读取边界。
          minLength: 1
          maxLength: 2048
        snapshotAt:
          type: string
          format: date-time
    AuditAttentionPreview:
      type: object
      description: |
        当前节点风险关注批次的安全摘要。该批次由服务端定义；客户端不得按操作、时间桶或事件列表
        自行构造确认边界。
      required:
        [
          attentionId,
          state,
          categoryCounts,
          severity,
          firstOccurredAt,
          latestOccurredAt,
          result,
          action,
          target,
          summary,
          successCount,
          failureCount,
          affectedCount,
          unacknowledgedRiskEventCount,
        ]
      properties:
        attentionId:
          type: string
          description: 服务端签发的不透明风险关注批次标识，客户端不得解析或拼装。
          minLength: 1
          maxLength: 2048
        state:
          $ref: "#/components/schemas/AuditAttentionState"
        categoryCounts:
          type: array
          description: 批次成员按固定审计分类汇总；至少包含一个分类，按审计分类枚举顺序返回。
          minItems: 1
          items:
            $ref: "#/components/schemas/AuditCategoryCount"
        severity:
          $ref: "#/components/schemas/AuditSeverity"
        firstOccurredAt:
          type: string
          format: date-time
        latestOccurredAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/AuditAttentionResult"
        action:
          type: string
          description: 服务端按失败、严重性、发生时间和稳定事件标识优先级选出的风险批次主要操作名称。
          minLength: 1
          maxLength: 128
        target:
          $ref: "#/components/schemas/AuditTarget"
        summary:
          type: string
          description: 服务端脱敏的可行动摘要。
          minLength: 1
          maxLength: 512
        successCount:
          type: integer
          minimum: 0
        failureCount:
          type: integer
          minimum: 0
        affectedCount:
          type: integer
          minimum: 0
        unacknowledgedRiskEventCount:
          type: integer
          minimum: 0
        operationId:
          type: string
          description: 可选的本节点操作关联标识；仅供管理员跨节点人工对照，不表示远端已应用。
          minLength: 1
          maxLength: 255
        firstAcknowledgement:
          $ref: "#/components/schemas/AuditAcknowledgement"
    AuditAttention:
      allOf:
        - $ref: "#/components/schemas/AuditAttentionPreview"
        - type: object
          required: [riskEventCount, acknowledgedRiskEventCount]
          properties:
            riskEventCount:
              type: integer
              minimum: 0
            acknowledgedRiskEventCount:
              type: integer
              minimum: 0
    AuditAttentionDetail:
      type: object
      description: 当前节点风险关注批次详情和安全成员分页。
      required: [attention, items, totalCount]
      properties:
        attention:
          $ref: "#/components/schemas/AuditAttention"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        totalCount:
          type: integer
          minimum: 0
        nextCursor:
          type: string
          description: 下一页的不透明游标；没有下一页时省略。
          minLength: 1
          maxLength: 2048
    AcknowledgeAuditAttentionRequest:
      type: object
      description: |
        只接受服务端签发的风险关注批次标识；身份从当前会话取得，客户端不得提交确认人、时间或成员事件。
      required: [attentionId]
      properties:
        attentionId:
          type: string
          minLength: 1
          maxLength: 2048
    AcknowledgeAuditAttentionResponse:
      type: object
      description: |
        原子确认结果。重复或并发请求返回同一批次最先成功的确认身份快照和时间；
        `newlyAcknowledgedCount` 为本请求实际新增确认的风险事件数。
      required:
        [
          attentionId,
          firstAcknowledgement,
          totalRiskEventCount,
          newlyAcknowledgedCount,
          unacknowledgedRiskEventCount,
        ]
      properties:
        attentionId:
          type: string
          minLength: 1
          maxLength: 2048
        firstAcknowledgement:
          $ref: "#/components/schemas/AuditAcknowledgement"
        totalRiskEventCount:
          type: integer
          minimum: 0
          description: attentionId 绑定快照内风险成员总数，不受本次是否重复确认影响。
        newlyAcknowledgedCount:
          type: integer
          minimum: 0
        unacknowledgedRiskEventCount:
          type: integer
          minimum: 0
    AuditAttentionNotificationList:
      type: object
      description: |
        当前节点风险通知批次分页。缺省请求（未携带任何筛选参数）保持页眉通知口径：最近 24 小时、
        仅未确认批次、失败优先排序、最多 20 条预览，并返回 `totalUnacknowledged`（等于该请求下的
        `total`）供页眉徽标使用；携带 `from`/`to`/`status`/`limit`/`cursor` 时返回与 `status`
        同口径的分页列表（时间排序），`items` 可包含已确认批次。
      required: [items, total, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AuditAttentionPreview"
        total:
          type: integer
          minimum: 0
          description: 与请求 `status` 筛选同口径的通知批次总数（分页权威总数）。
        totalUnacknowledged:
          type: integer
          minimum: 0
          description: |
            最近 24 小时未确认风险批次总数（页眉徽标口径）。仅缺省请求返回，
            与缺省请求下的 `total` 相等；保留该字段是为了兼容既有页眉客户端。
        hasMore:
          type: boolean
          description: 是否还有下一页；由 `limit` 与匹配总数决定。
        nextCursor:
          type: string
          description: 下一页的不透明游标；没有下一页时省略。
          minLength: 1
          maxLength: 2048
    StatusInfo:
      type: object
      required: [version, ready, initialized, migrationVersion, userCount, bootstrapAllowed]
      properties:
        version:
          type: string
        ready:
          type: boolean
        initialized:
          type: boolean
        migrationVersion:
          type: string
        userCount:
          type: integer
        bootstrapAllowed:
          type: boolean
          description: 当前实例是否允许首个管理员自举；备用节点即使空库也始终为 false
    EnabledFormats:
      type: object
      required: [formats]
      properties:
        formats:
          type: array
          description: 当前进程启动时启用的格式，按字典序返回
          items:
            type: string
            enum: [raw, maven, npm, docker, cargo, pypi, gomod, nuget]
    BootstrapRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, username, role, status, webLoginDisabled, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
        webLoginDisabled:
          type: boolean
          description: 是否禁止该账号登录 Web 与管理 API；不影响原生协议账号密码发布
        createdAt:
          type: string
    UserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, user]
          default: user
    UpdateUserRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
        webLoginDisabled:
          type: boolean
          description: 是否禁止该账号登录 Web 与管理 API；不影响原生协议账号密码发布
    PublishPolicyRequest:
      type: object
      properties:
        webLoginDisabled:
          type: boolean
          description: 是否禁止该账号登录 Web 与管理 API
        allowedPrefixes:
          type: array
          items:
            type: string
          description: 可选的发布路径前缀；空数组表示不限制前缀
        pathPrefixes:
          type: array
          items:
            type: string
          description: allowedPrefixes 的兼容别名
        maxAssetsHour:
          type: integer
          format: int64
          minimum: 0
          description: 每小时新增制品数上限；零表示不限制
        maxBytesDay:
          type: integer
          format: int64
          minimum: 0
          description: 每日上传总字节上限；零表示不限制
        maxFileBytes:
          type: integer
          format: int64
          minimum: 0
          description: 单文件字节上限；零表示不限制
        immutableRelease:
          type: boolean
          description: 已废弃，只读兼容字段；写入会被拒绝，请改用仓库 immutableRelease 配置
    PublishPolicyResponse:
      type: object
      required:
        [
          userId,
          username,
          webLoginDisabled,
          repository,
          allowedPrefixes,
          maxAssetsHour,
          maxBytesDay,
          maxFileBytes,
          immutableRelease,
        ]
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        webLoginDisabled:
          type: boolean
        repository:
          type: string
        allowedPrefixes:
          type: array
          items:
            type: string
        maxAssetsHour:
          type: integer
          format: int64
        maxBytesDay:
          type: integer
          format: int64
        maxFileBytes:
          type: integer
          format: int64
        immutableRelease:
          type: boolean
          description: 只读兼容字段，值来自仓库 immutableRelease 配置
    PasswordChangeRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8
    Token:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    TokenCreated:
      type: object
      required: [id, name, token, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        token:
          type: string
          description: 明文令牌，仅此次返回一次。
        createdAt:
          type: string
    Repository:
      type: object
      required: [id, name, format, type, visibility, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        format:
          type: string
          enum: [raw, maven, npm, docker, cargo, pypi, gomod, nuget]
        type:
          type: string
          enum: [hosted, proxy, group]
        visibility:
          type: string
          enum: [public, private]
        online:
          type: boolean
          description: 仓库是否在线（管理员可手动置离线；offline 不参与复制）
        connectionStatus:
          $ref: "#/components/schemas/ConnectionStatus"
          description: 上游连接状态（仅 proxy/group 返回；可选字段，向后兼容）
        description:
          type: string
          description: 仓库描述（管理后台可配置，详情页展示）
        remoteUrl:
          type: string
          description: proxy 仓库的上游地址（仅 type=proxy）
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: proxy 上游凭据的受限逻辑名称；运行时仅从 JIAN_UPSTREAM_CREDENTIAL_<名称> 读取（仅 type=proxy，非密钥明文）
        immutableRelease:
          type: boolean
          description: hosted 仓库是否拒绝覆盖已存在的 Release
        members:
          type: array
          items:
            type: string
          description: group 仓库的成员仓库名（有序，仅 type=group）
        createdAt:
          type: string
        artifactCount:
          type: integer
          description: 仓库内制品数量（只读统计字段）
        totalSize:
          type: integer
          format: int64
          description: 仓库内制品总字节数（只读统计字段）
    RepositoryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
        total:
          type: integer
    CreateRepositoryRequest:
      type: object
      required: [name, format, type]
      properties:
        name:
          type: string
          minLength: 1
        format:
          type: string
          enum: [raw, maven, npm, docker, cargo, pypi, gomod, nuget]
        type:
          type: string
          enum: [hosted, proxy, group]
        visibility:
          type: string
          enum: [public, private]
          default: private
        description:
          type: string
          description: 仓库描述（可选）
        remoteUrl:
          type: string
          description: proxy 仓库的上游地址（type=proxy 时必填）
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: proxy 上游凭据的受限逻辑名称；运行时仅从 JIAN_UPSTREAM_CREDENTIAL_<名称> 读取（仅 type=proxy，非密钥明文）
        immutableRelease:
          type: boolean
          description: 创建 hosted 仓库时是否拒绝覆盖已存在的 Release
        members:
          type: array
          items:
            type: string
          description: group 仓库的成员仓库名（有序，type=group 时必填）
    UpdateRepositoryRequest:
      type: object
      properties:
        visibility:
          type: string
          enum: [public, private]
        description:
          type: string
          description: 更新仓库描述（传空串表示清空）
        remoteUrl:
          type: string
          description: 更新 proxy 上游地址（仅 type=proxy）
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 更新 proxy 上游凭据的受限逻辑名称；运行时仅从 JIAN_UPSTREAM_CREDENTIAL_<名称> 读取（仅 type=proxy，非密钥明文）
        immutableRelease:
          type: boolean
          description: 更新 hosted 仓库是否拒绝覆盖已存在的 Release
        members:
          type: array
          items:
            type: string
          description: 更新 group 成员仓库名（仅 type=group）
    SetRepositoryOnlineRequest:
      type: object
      properties:
        online:
          type: boolean
          description: 是否在线（true=在线，false=离线；必填）
    ConnectionStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [READY, AVAILABLE, UNAVAILABLE, AUTO_BLOCKED, OFFLINE]
          description: 上游连接状态（READY=尚未探测，AVAILABLE=可用，AUTO_BLOCKED=自动阻止，UNAVAILABLE=不可用，OFFLINE=手动离线）
        blockedUntil:
          type: string
          format: date-time
          nullable: true
          description: 自动阻止窗口截止时间（非阻止状态为 null）
        description:
          type: string
          description: 状态说明（供展示）
    AclEntry:
      type: object
      required: [subjectId, action]
      properties:
        subjectId:
          type: integer
          format: int64
        action:
          type: string
          enum: [read, write, admin]
    AclList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AclEntry"
    PutAclRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AclEntry"
    AssetSummary:
      type: object
      required: [path, size, hash, updatedAt]
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
        hash:
          type: string
          description: 内容寻址 blob 的 sha256 摘要
        sha1:
          type: string
          description: 制品内容的 SHA-1 摘要（写入时计算登记）
        md5:
          type: string
          description: 制品内容的 MD5 摘要（写入时计算登记）
        contentType:
          type: string
        createdAt:
          type: string
          description: 首次写入时间
        updatedAt:
          type: string
    AssetList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssetSummary"
        total:
          type: integer
    BatchDeleteAssetsRequest:
      type: object
      required: [paths, overrideReason]
      properties:
        paths:
          type: array
          description: 待删除的制品路径列表（单条非空，上限 500 条）
          minItems: 1
          maxItems: 500
          items:
            type: string
        overrideReason:
          type: string
          minLength: 1
          maxLength: 512
          description: 管理员执行批量删除的原因
    BatchDeleteAssetFailure:
      type: object
      required: [path, error]
      properties:
        path:
          type: string
        error:
          type: string
    BatchDeleteAssetsResponse:
      type: object
      required: [deleted, failed]
      properties:
        deleted:
          type: integer
          description: 成功删除的制品数
        failed:
          type: array
          items:
            $ref: "#/components/schemas/BatchDeleteAssetFailure"
          description: 兼容字段；统一事务成功时始终为空数组
    AssetOperationRequest:
      type: object
      required: [action, targets, overrideReason]
      properties:
        action:
          type: string
          enum: [delete, move, rename]
        targets:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/AssetOperationTarget"
        destinationPath:
          type: string
          description: move 的目标目录；保留所选文件名和相对层级
        newPath:
          type: string
          description: rename 的新完整路径，仅允许单项
        overrideReason:
          type: string
          minLength: 1
          maxLength: 512
          description: 管理员执行资产变更的原因，协议端点不要求此字段
    AssetOperationTarget:
      type: object
      required: [type, path]
      properties:
        type:
          type: string
          enum: [raw_path, maven_version, maven_artifact, npm_package, npm_version, asset_path]
        path:
          type: string
          description: 目标路径或格式逻辑标识；npm_version 使用 package@version
    AssetOperationResponse:
      type: object
      required: [operationId, affected]
      properties:
        operationId:
          type: string
        affected:
          type: integer
          description: 实际变更的资产数量
    UsageSnippet:
      type: object
      required: [title, code]
      properties:
        title:
          type: string
        description:
          type: string
        code:
          type: string
    UsageInfo:
      type: object
      required: [format, type, snippets]
      properties:
        format:
          type: string
        type:
          type: string
        description:
          type: string
          description: 仓库描述（匿名详情页页头展示）
        snippets:
          type: array
          items:
            $ref: "#/components/schemas/UsageSnippet"
    MigrationSourceType:
      type: string
      enum: [online_rest, offline_dir, offline_bundle]
    MigrationConflictPolicy:
      type: string
      enum: [skip, overwrite, fail]
      default: skip
    MigrationTaskStatus:
      type: string
      enum: [planned, running, completed, failed, cancelled]
    MigrationSourceAuthType:
      type: string
      enum: [anonymous, basic, bearer]
      description: 在线 Nexus 来源认证方式；不包含用户名、密码或令牌。
    MigrationSourceAuthAnonymous:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [anonymous]
    MigrationSourceAuthBasic:
      type: object
      required: [type, username, password]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [basic]
        username:
          type: string
          minLength: 1
          description: Nexus 用户名或 User Token 名称；仅写入。
          writeOnly: true
        password:
          type: string
          minLength: 1
          description: Nexus 密码或 User Token Passcode；仅写入。
          writeOnly: true
    MigrationSourceAuthBearer:
      type: object
      required: [type, token]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [bearer]
        token:
          type: string
          minLength: 1
          description: Nexus JWT、Access Token 或 npm Token；仅写入。
          writeOnly: true
    MigrationSourceAuth:
      oneOf:
        - $ref: "#/components/schemas/MigrationSourceAuthAnonymous"
        - $ref: "#/components/schemas/MigrationSourceAuthBasic"
        - $ref: "#/components/schemas/MigrationSourceAuthBearer"
      discriminator:
        propertyName: type
        mapping:
          anonymous: "#/components/schemas/MigrationSourceAuthAnonymous"
          basic: "#/components/schemas/MigrationSourceAuthBasic"
          bearer: "#/components/schemas/MigrationSourceAuthBearer"
      description: 在线 Nexus 来源认证材料；仅请求写入，服务端加密保存，永不在响应、任务、报告或日志中返回。
    RemoteNexusRepositoryRequest:
      type: object
      required: [sourceConfig]
      additionalProperties: false
      properties:
        sourceConfig:
          $ref: "#/components/schemas/RemoteNexusSourceConfig"
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 兼容已有在线来源的上游凭据逻辑名称；与 sourceAuth 互斥。
        sourceAuth:
          $ref: "#/components/schemas/MigrationSourceAuth"
    RemoteNexusSourceConfig:
      oneOf:
        - $ref: "#/components/schemas/MigrationOnlineURLSourceConfig"
        - $ref: "#/components/schemas/MigrationOnlineSourceRefConfig"
      description: 在线 Nexus 来源配置；直填 URL 或兼容 sourceRef 二选一，禁止认证材料和离线路径。
    RemoteNexusRepository:
      type: object
      required: [name, format, type]
      properties:
        name:
          type: string
        format:
          type: string
        type:
          type: string
          enum: [hosted, proxy, group]
    RemoteNexusRepositoryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RemoteNexusRepository"
        total:
          type: integer
    MigrationSourceConfig:
      oneOf:
        - $ref: "#/components/schemas/MigrationOnlineURLSourceConfig"
        - $ref: "#/components/schemas/MigrationOnlineSourceRefConfig"
        - $ref: "#/components/schemas/MigrationOfflineSourceConfig"
      description: 来源配置。online_rest 提供 url 或 sourceRef 二选一；offline_dir 与 offline_bundle 仅提供 path。禁止认证材料和其他字段。
    MigrationOnlineURLSourceConfig:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: 外部 Nexus REST 基址；仅允许无用户信息、查询参数和片段的绝对 http 或 https URL。
    MigrationOnlineSourceRefConfig:
      type: object
      required: [sourceRef]
      additionalProperties: false
      properties:
        sourceRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 兼容已有任务的受限逻辑来源名称；运行时仅从 JIAN_MIGRATION_SOURCE_<名称> 读取。
    MigrationOfflineSourceConfig:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          description: 离线目录或离线导出包路径。
    MigrationPlanRepository:
      type: object
      required: [name, format]
      properties:
        name:
          type: string
        format:
          type: string
          enum: [raw, maven, npm, docker, cargo, pypi, gomod, nuget]
        type:
          type: string
          enum: [hosted, proxy, group]
        estimatedAssets:
          type: integer
          format: int64
        config:
          type: object
          additionalProperties: true
          description: 无敏感的目标配置摘要
        migrationMode:
          type: string
          enum: [assets, proxy_config, group_config, unsupported]
        warnings:
          type: array
          items:
            type: string
    MigrationPlan:
      type: object
      required: [repositories, warnings, stats]
      properties:
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/MigrationPlanRepository"
        warnings:
          type: array
          items:
            type: string
        stats:
          type: object
          additionalProperties: true
        estimated:
          type: boolean
          description: 资产数是否为估算
        sourceRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: online_rest 的受限逻辑来源名称；运行时仅从 JIAN_MIGRATION_SOURCE_<名称> 读取，不包含 URL、主机名、IP 或凭据
    MigrationTask:
      type: object
      required: [id, status, sourceType, conflictPolicy, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/MigrationTaskStatus"
        sourceType:
          $ref: "#/components/schemas/MigrationSourceType"
        sourceConfig:
          $ref: "#/components/schemas/MigrationSourceConfig"
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 上游凭据的受限逻辑名称；运行时仅从 JIAN_UPSTREAM_CREDENTIAL_<名称> 读取，非密钥明文
        sourceAuthType:
          $ref: "#/components/schemas/MigrationSourceAuthType"
        conflictPolicy:
          $ref: "#/components/schemas/MigrationConflictPolicy"
        plan:
          $ref: "#/components/schemas/MigrationPlan"
        errorMessage:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        startedAt:
          type: string
        finishedAt:
          type: string
    MigrationTaskList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MigrationTask"
        total:
          type: integer
    CreateMigrationRequest:
      type: object
      required: [sourceType]
      properties:
        sourceType:
          $ref: "#/components/schemas/MigrationSourceType"
        sourceConfig:
          $ref: "#/components/schemas/MigrationSourceConfig"
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 兼容已有在线来源的上游凭据逻辑名称；与 sourceAuth 互斥。
        sourceAuth:
          $ref: "#/components/schemas/MigrationSourceAuth"
        conflictPolicy:
          $ref: "#/components/schemas/MigrationConflictPolicy"
        plan:
          $ref: "#/components/schemas/MigrationPlan"
    StartMigrationRequest:
      type: object
      properties:
        includeRepositories:
          type: array
          items:
            type: string
          description: 启动前收窄 plan，仅迁移这些仓库；空或省略表示全部
    MigrationDiscoverRequest:
      type: object
      required: [sourceType]
      properties:
        sourceType:
          $ref: "#/components/schemas/MigrationSourceType"
        sourceConfig:
          $ref: "#/components/schemas/MigrationSourceConfig"
        credentialRef:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,62}$"
          description: 兼容已有在线来源的上游凭据逻辑名称；与 sourceAuth 互斥。
        sourceAuth:
          $ref: "#/components/schemas/MigrationSourceAuth"
        conflictPolicy:
          $ref: "#/components/schemas/MigrationConflictPolicy"
    MigrationDiscoverResponse:
      type: object
      required: [taskId, plan]
      properties:
        taskId:
          type: integer
          format: int64
        plan:
          $ref: "#/components/schemas/MigrationPlan"
    MigrationReport:
      type: object
      required: [taskId, status, totals]
      properties:
        taskId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/MigrationTaskStatus"
        sourceType:
          $ref: "#/components/schemas/MigrationSourceType"
        conflictPolicy:
          $ref: "#/components/schemas/MigrationConflictPolicy"
        startedAt:
          type: string
        finishedAt:
          type: string
        totals:
          type: object
          additionalProperties: true
        repositories:
          type: array
          items:
            type: object
            additionalProperties: true
        failures:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        cutover:
          type: object
          additionalProperties: true
        raw:
          type: object
          additionalProperties: true
          description: 任务 report_json 原文透传（foundation 可为空对象）
    BackupCounts:
      type: object
      additionalProperties: false
      description: 包内各实体记录数，供导入端核对规模。
      properties:
        users:
          type: integer
        tokens:
          type: integer
        repositories:
          type: integer
        acls:
          type: integer
        assets:
          type: integer
        formatMetadata:
          type: integer
    BackupPackage:
      type: object
      required: [packageId, mode, status, sizeBytes, createdAt]
      additionalProperties: false
      description: 节点备份包登记（包体为 tar.gz，不含密钥与节点本地配置）。
      properties:
        packageId:
          type: string
        mode:
          type: string
          enum: [hot, frozen]
        basePackageId:
          type: string
          description: 非空表示这是基于该基线包生成的增量差包。
        status:
          type: string
          enum: [queued, snapshotting, packing, done, failed]
        label:
          type: string
        sizeBytes:
          type: integer
          format: int64
        counts:
          $ref: "#/components/schemas/BackupCounts"
        nodeId:
          type: string
        appVersion:
          type: string
        dbSchemaVersion:
          type: integer
        createdAt:
          type: string
        finishedAt:
          type: string
        errorSummary:
          type: string
    BackupPackageList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupPackage"
        total:
          type: integer
    CreateBackupRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [hot, frozen]
        label:
          type: string
          maxLength: 200
    CreateBackupLinkRequest:
      type: object
      additionalProperties: false
      properties:
        ttlSeconds:
          type: integer
          description: 链接有效期（秒），默认 1800，上限 86400。
          minimum: 60
          maximum: 86400
    BackupLink:
      type: object
      required: [url, expiresAt]
      additionalProperties: false
      properties:
        url:
          type: string
        expiresAt:
          type: string
    BackupVerification:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
        packageId:
          type: string
        deep:
          type: boolean
        blobs:
          type: integer
        assets:
          type: integer
        error:
          type: string
    WriteFreezeState:
      type: object
      required: [frozen]
      additionalProperties: false
      description: 节点写入冻结状态。未冻结时 until/frozenAt 缺省（表示当前无生效窗口）。
      properties:
        frozen:
          type: boolean
        until:
          type: string
          format: date-time
          description: 冻结自动解除的时刻；手动冻结且无窗口时缺省。
        frozenAt:
          type: string
          format: date-time
        reason:
          type: string
    FreezeWritesRequest:
      type: object
      additionalProperties: false
      description: until 与 ttlSeconds 二选一；都给时 until 优先。都不给则用 ttlSeconds 默认 7200。窗口上限 24 小时。
      properties:
        until:
          type: string
          format: date-time
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        reason:
          type: string
          maxLength: 200
    BackupImportOrigin:
      type: string
      enum: [url, upload, cli]
    BackupUploadStatus:
      type: string
      enum: [initialized, receiving, completed, aborted]
    BackupUploadSession:
      type: object
      required: [uploadId, fileName, totalBytes, chunkSize, uploadedChunks, status, expiresAt]
      additionalProperties: false
      description: 一次分片上传会话的视图。uploadedChunks 由磁盘上真实存在的分片推导（以磁盘为准，可续传）。
      properties:
        uploadId:
          type: string
        fileName:
          type: string
        totalBytes:
          type: integer
          format: int64
        chunkSize:
          type: integer
          format: int64
        uploadedChunks:
          type: array
          items:
            type: integer
        status:
          $ref: "#/components/schemas/BackupUploadStatus"
        expiresAt:
          type: string
          format: date-time
    CreateBackupUploadRequest:
      type: object
      required: [fileName, totalBytes]
      additionalProperties: false
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        totalBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 53687091200
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 可选：归档整体摘要（64 位小写 hex），拼装完成后核对。
    CompleteBackupUploadRequest:
      type: object
      additionalProperties: false
      properties:
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 可选：客户端侧声明的归档摘要，拼装完成后核对。
        overwrite:
          type: boolean
          description: 目标实例非空时需显式置真。内置 anonymous 主体不计入「非空」。
        deep:
          type: boolean
          description: 逐 blob 比对内容摘要（耗时与包体积同阶）。
    BackupImportStatus:
      type: string
      enum: [queued, fetching, staging, pending_restart, done, failed]
    BackupImport:
      type: object
      required: [importId, origin, status, operator, overwrite, deep, createdAt, updatedAt]
      additionalProperties: false
      description: |
        一次导入的记录。pending_restart 表示校验与暂存已完成、restore.pending 已写入，
        需重启服务才会替换数据库并转为 done。
      properties:
        importId:
          type: string
        origin:
          $ref: "#/components/schemas/BackupImportOrigin"
        status:
          $ref: "#/components/schemas/BackupImportStatus"
        sourceUrl:
          type: string
          description: URL 拉取通道的来源地址；其它通道缺省。
        operator:
          type: string
        overwrite:
          type: boolean
        deep:
          type: boolean
        totalBytes:
          type: integer
          format: int64
        fetchedBytes:
          type: integer
          format: int64
        blobCount:
          type: integer
        packageId:
          type: string
          description: 包内 manifest 的 packageId（校验通过后才有值）。
        errorCode:
          type: string
        error:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        finishedAt:
          type: string
        restorePendingAt:
          type: string
    BackupImportList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackupImport"
        total:
          type: integer
    CreateBackupImportRequest:
      type: object
      required: [sourceUrl]
      additionalProperties: false
      properties:
        sourceUrl:
          type: string
          maxLength: 2048
          description: 备份包归档的 http/https 地址。
        overwrite:
          type: boolean
          description: 目标实例非空时需显式置真。内置 anonymous 主体不计入「非空」。
        deep:
          type: boolean
          description: 逐 blob 比对内容摘要（耗时与包体积同阶）。
        expectedSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 可选：拉取完成后核对的归档摘要。
