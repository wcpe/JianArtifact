        totalDownloadCount 与树节点 downloadCount 同口径（原始累计），不受 from/to 约束。
        该端点与仓库树同级同权限（匿名 public 200 / 匿名 private 401 / 无授权 403 / 不存在 404），
        不含来源 IP / UA 明文。
      required: [from, to, effectiveBucket, totalDownloadCount, trend]
