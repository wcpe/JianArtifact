# JianArtifact API 契约 —— 唯一真源（设计优先，见 docs/adr/0004-design-first-openapi.md）。
# 变更此文件后运行 `task gen` 重生成 Go 接口与类型；生成产物不得手改。
# 0.4.0：Nexus 迁移管理面（discover / planned / start / resume / report）。
openapi: 3.0.3
info:
  title: JianArtifact API
  version: 0.4.0
  description: 自托管多格式制品仓库的管理 API。协议端点（Raw/Maven/npm 等原生客户端交互）以协议兼容测试保障，不在此契约内描述。
  license:
    name: MIT
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 存活探针
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadyz
      summary: 就绪探针（SQLite + blob 目录自检通过后才返回 200）
      security: []
      responses:
        "200":
          description: 已就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: 未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus 指标（文本暴露格式，匿名可见且不含版本等指纹信息）
      security: []
      responses:
        "200":
          description: 指标快照
          content:
            text/plain:
              schema:
                type: string
  /api/v1/status:
    get:
      operationId: getStatus
      summary: 运行时状态（版本、就绪、迁移版本、初始化标志、用户数与自举许可）
      security: []
      responses:
        "200":
          description: 状态信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusInfo"
  /api/v1/formats/enabled:
    get:
      operationId: getEnabledFormats
      summary: 当前进程启用的协议格式（仅管理员）
      responses:
        "200":
          description: 启用格式清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnabledFormats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/observability/audit/summary:
    get:
      operationId: getAuditObservabilitySummary
      summary: 当前节点统一审计概览（仅管理员）
      description: |
        目标契约，待实现。仅全局管理员可读取。统一当前节点的不可变管理审计和复制尝试审计；不跨节点读取、
        不返回原始诊断字段或任何凭据。`from` 与 `to` 必须同时提供或同时省略；省略时服务端
        使用最近 24 小时。时间范围为 UTC `[from,to)`，最长 30 天。响应中的 `snapshot` 只能
        与相同范围和筛选条件的事件查询共同使用。
      parameters:
        - $ref: "#/components/parameters/AuditFromParam"
        - $ref: "#/components/parameters/AuditToParam"
        - $ref: "#/components/parameters/AuditCategoryParam"
        - $ref: "#/components/parameters/AuditResultParam"
        - $ref: "#/components/parameters/AuditActorParam"
        - $ref: "#/components/parameters/AuditRepositoryParam"
        # 与事件查询保持同一筛选集合：概览签发的 snapshot 只能与相同筛选条件共同使用。
        - $ref: "#/components/parameters/AuditQueryParam"
        - $ref: "#/components/parameters/AuditAttentionParam"
        - $ref: "#/components/parameters/AuditMethodParam"
        - $ref: "#/components/parameters/AuditActionParam"
        - $ref: "#/components/parameters/AuditActorEmailParam"
        - $ref: "#/components/parameters/AuditClientIpParam"
        - $ref: "#/components/parameters/AuditAuthSourceParam"
      responses:
        "200":
          description: 当前节点统一审计概览和稳定快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditObservabilitySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/observability/audit/events:
    get:
      operationId: listAuditObservabilityEvents
      summary: 当前节点统一审计事件（仅管理员）
      description: |
        目标契约，待实现。仅全局管理员可读取。返回主列表可安全展示的字段；客户端 IP 按策略返回（可关闭），
        不得返回 User-Agent、请求标识、原始响应体、内部地址或任何凭据。`snapshot`、`cursor` 和 `eventId` 均为不透明服务端值，
        客户端不得解析。携带 `snapshot` 时，时间范围与筛选条件必须与其签发请求一致。
      parameters:
        - $ref: "#/components/parameters/AuditFromParam"
        - $ref: "#/components/parameters/AuditToParam"
        - $ref: "#/components/parameters/AuditCategoryParam"
        - $ref: "#/components/parameters/AuditResultParam"
        - $ref: "#/components/parameters/AuditActorParam"
        - $ref: "#/components/parameters/AuditRepositoryParam"
        - $ref: "#/components/parameters/AuditQueryParam"
        - $ref: "#/components/parameters/AuditAttentionParam"
        - $ref: "#/components/parameters/AuditMethodParam"
        - $ref: "#/components/parameters/AuditActionParam"
        - $ref: "#/components/parameters/AuditActorEmailParam"
        - $ref: "#/components/parameters/AuditClientIpParam"
        - $ref: "#/components/parameters/AuditIncludeReplicationParam"
        - $ref: "#/components/parameters/AuditAuthSourceParam"
        - $ref: "#/components/parameters/AuditOffsetParam"
        - $ref: "#/components/parameters/AuditSnapshotParam"
        - $ref: "#/components/parameters/AuditCursorParam"
        - $ref: "#/components/parameters/AuditLimitParam"
      responses:
        "200":
          description: 当前节点统一审计事件分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/observability/audit/attentions:
    get:
      operationId: listAuditAttentions
      summary: 当前节点风险关注批次（仅管理员）
      description: |
        仅全局管理员可读取。使用与审计概览、原始事件相同的稳定快照和筛选条件，返回服务端权威的
        风险关注批次分页。`snapshot`、`cursor` 与 `attentionId` 均为不透明服务端值，客户端不得解析。
        不返回原始审计详情、IP、User-Agent、请求标识、内部地址或凭据。
      parameters:
        - $ref: "#/components/parameters/AuditFromParam"
        - $ref: "#/components/parameters/AuditToParam"
        - $ref: "#/components/parameters/AuditCategoryParam"
        - $ref: "#/components/parameters/AuditResultParam"
        - $ref: "#/components/parameters/AuditActorParam"
        - $ref: "#/components/parameters/AuditRepositoryParam"
        - $ref: "#/components/parameters/AuditQueryParam"
        - $ref: "#/components/parameters/AuditAttentionParam"
        - $ref: "#/components/parameters/AuditMethodParam"
        - $ref: "#/components/parameters/AuditActionParam"
        - $ref: "#/components/parameters/AuditActorEmailParam"
        - $ref: "#/components/parameters/AuditClientIpParam"
        - $ref: "#/components/parameters/AuditAuthSourceParam"
        - $ref: "#/components/parameters/AuditOffsetParam"
        - $ref: "#/components/parameters/AuditSnapshotParam"
        - $ref: "#/components/parameters/AuditCursorParam"
        - $ref: "#/components/parameters/AuditLimitParam"
      responses:
        "200":
          description: 当前节点风险关注批次分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditAttentionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 快照无效或筛选条件不一致（error.code 为 attention_stale）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/observability/audit/events/{eventId}:
    get:
      operationId: getAuditObservabilityEvent
      summary: 当前节点统一审计事件详情（仅管理员）
      description: |
        目标契约，待实现。仅全局管理员可读取。详情只扩展服务端脱敏后的结果分类和变更摘要，不返回原始审计详情、
        IP、User-Agent、请求标识、内部地址或任何凭据。
      parameters:
        - $ref: "#/components/parameters/AuditEventIdParam"
      responses:
        "200":
          description: 当前节点安全审计事件详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/observability/audit/attention/{attentionId}:
    get:
      operationId: getAuditAttention
      summary: 当前节点风险关注批次详情（仅管理员）
      description: |
        目标契约，待实现。仅全局管理员可读取。`attentionId` 是服务端签发的当前节点风险批次标识，客户端不得以
        事件标识、时间桶或浏览器本地状态拼装它。响应安全分页列出该批次成员，并给出服务端
        权威的未确认计数和确认身份快照；已确认批次仍可读取，供完整审计追溯。
      parameters:
        - $ref: "#/components/parameters/AuditAttentionIdParam"
        - $ref: "#/components/parameters/AuditCursorParam"
        - $ref: "#/components/parameters/AuditLimitParam"
      responses:
        "200":
          description: 当前节点风险关注批次详情和安全成员分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditAttentionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: attentionId 无效或对应快照不可重建（error.code 为 attention_stale）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/observability/audit/attention-acknowledgements:
    put:
      operationId: acknowledgeAuditAttention
      summary: 确认当前节点风险关注批次（仅管理员）
      description: |
        目标契约，待实现。仅全局管理员可写。请求只提交服务端签发的 `attentionId`，服务端在一个短 SQLite 事务内
        展开并确认该标识绑定的不可变快照内全部未确认风险事件；签发后新增的风险事件不属于该次确认。
        客户端不得枚举成员事件。重复或并发请求幂等，最先成功的确认身份快照和时间保持不变。确认状态与确认审计均不参与复制；备用节点按
        既有只读规则返回 `503`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgeAuditAttentionRequest"
      responses:
        "200":
          description: 已原子确认，或返回既有的最先确认结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcknowledgeAuditAttentionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: attentionId 无效、对应快照不可重建或批次成员不再满足确认条件（error.code 为 attention_stale）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 备用节点只读，拒绝确认写入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/observability/audit/notifications:
    get:
      operationId: listAuditAttentionNotifications
      summary: 当前节点风险通知批次分页（仅管理员）
      description: |
        仅全局管理员可读取。缺省请求（未携带任何筛选参数）保持页眉通知口径：服务端固定以当前时刻向前
        24 小时筛选未确认风险批次，按失败优先、严重性和最新时间排序，`items` 最多返回 20 条预览，
        `totalUnacknowledged` 表示全部数量，超过预览上限时 `hasMore` 为 true。携带
        `from`/`to`/`status`/`limit`/`cursor` 时返回与 `status` 同口径的分页列表（时间排序），
        `items` 可包含已确认批次，`total` 为该口径的权威总数。不得返回 IP、User-Agent、请求标识、
        来源节点、内部地址或任何凭据。
      parameters:
        - $ref: "#/components/parameters/AuditFromParam"
        - $ref: "#/components/parameters/AuditToParam"
        - $ref: "#/components/parameters/AuditNotificationStatusParam"
        - $ref: "#/components/parameters/AuditNotificationLimitParam"
        - $ref: "#/components/parameters/AuditCursorParam"
      responses:
        "200":
          description: 当前节点风险通知批次分页（缺省为最近 24 小时未确认风险预览）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditAttentionNotificationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/observability/downloads/by-client:
    get:
      operationId: getDownloadByClient
      summary: 制品下载来源聚合（仅管理员）
      description: |
        按来源 IP（Top 10，明文仅管理员）与客户端类型（UA 归类，不暴露原始 UA 串）聚合。
        去重口径固定为「同 IP + 同制品 1 小时窗口只计一次贡献」（独立来源视角）；
        原始累计口径见仪表盘 downloadTrend。
      parameters:
        - $ref: "#/components/parameters/ObservabilityFromParam"
        - $ref: "#/components/parameters/ObservabilityToParam"
      responses:
        "200":
          description: 下载来源聚合
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadClientRanking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/observability/downloads/trend:
    get:
      operationId: getDownloadTrendGrouped
      summary: 分组下载趋势与分组总计（仅管理员）
      description: |
        按桶输出分组下载时序 `points`（稀疏「桶 × 组」，缺失桶即 0，前端对齐桶轴补零）
        与全窗口分组总计 `totals`（按计数降序，饼图数据源）。
        groupBy=family 按 UA 归类分组（默认，不暴露原始 UA 串）；groupBy=ip 返回来源 IP 明文，
        与 by-client 同一隐私边界（IP 明文仅管理员可见，端点整体仅管理员）。
        采集口径与仪表盘 downloadTrend 同源（原始累计）；from/to 成对提供或全省略（缺省最近 24 小时），跨度最长 30 天。
      parameters:
        - $ref: "#/components/parameters/ObservabilityFromParam"
        - $ref: "#/components/parameters/ObservabilityToParam"
        - $ref: "#/components/parameters/DownloadGroupByParam"
        - $ref: "#/components/parameters/DownloadRepoParam"
      responses:
        "200":
          description: 分组下载趋势（桶轴参数与稀疏点同响应返回）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadGroupedTrendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          description: 过滤用的仓库名不存在（含已删除 / 未跟随重命名的旧名）
          $ref: "#/components/responses/NotFound"
  /api/v1/observability/dashboard:
    get:
      operationId: getOperationsDashboard
      summary: 当前节点业务仪表盘（仅管理员）
      description: 只返回当前实例的真实协议聚合和逻辑制品容量，不含主机或其他节点数据。
      parameters:
        - $ref: "#/components/parameters/ObservabilityFromParam"
        - $ref: "#/components/parameters/ObservabilityToParam"
      responses:
        "200":
          description: 当前节点业务概览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsDashboard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/observability/host:
    get:
      operationId: getHostMonitoring
      summary: 当前主机监控（仅管理员）
      description: 只返回当前实例所在主机的持久化分钟样本，不读取或汇总其他节点。
      parameters:
        - $ref: "#/components/parameters/ObservabilityFromParam"
        - $ref: "#/components/parameters/ObservabilityToParam"
        - $ref: "#/components/parameters/HostInterfaceParam"
      responses:
        "200":
          description: 当前主机概览和趋势
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostMonitoring"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrap
      summary: 首启管理员自举（仅空库且状态接口 bootstrapAllowed 为 true 时可用）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: 首个管理员创建成功，返回会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 实例已初始化，自举关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 用户名 + 口令换取会话 JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: 当前会话对应的用户（OIDC 回调后前端据此取身份快照）
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/oidc/start:
    get:
      operationId: startOidcLogin
      summary: 起跳 OIDC 授权码流程（未启用 OIDC 时 404）
      security: []
      responses:
        "302":
          description: 重定向到身份提供方授权端点
          headers:
            Location:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/oidc/callback:
    get:
      operationId: completeOidcLogin
      summary: 完成 OIDC 授权码流程并重定向回前端（成功携令牌片段，失败携错误码片段）
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: 重定向回前端登录页
          headers:
            Location:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 注销当前会话（当前 JWT 记入吊销名单直至过期）
      responses:
        "204":
          description: 已注销
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: 用户列表（分页）
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
