          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/repositories/{name}/assets/batch-delete:
    post:
      operationId: batchDeleteRepositoryAssets
      summary: 批量删除仓库制品（仅管理员）
      deprecated: true
      description: |
        兼容入口。请求会委托统一资产操作事务引擎，整批成功或失败，不再部分成功。
      parameters:
        - $ref: "#/components/parameters/RepoNameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchDeleteAssetsRequest"
      responses:
        "200":
          description: 批量删除结果（统一事务成功时 failed 为空；失败以 4xx/5xx 返回）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDeleteAssetsResponse"
        "400":
          $ref: "#/components/responses/AssetOperationBadRequest"
        "401":
          $ref: "#/components/responses/AssetOperationUnauthorized"
        "403":
          $ref: "#/components/responses/AssetOperationForbidden"
        "404":
          $ref: "#/components/responses/AssetOperationNotFound"
        "409":
          $ref: "#/components/responses/AssetOperationConflict"
        "500":
          $ref: "#/components/responses/AssetOperationInternalError"
  /api/v1/repositories/{name}/assets/operations:
    post:
      operationId: applyRepositoryAssetOperation
      summary: 原子应用仓库制品操作（仅全局管理员）
      description: |
        hosted 仓库的格式感知删除，以及 Raw 文件/目录移动和单项重命名。
        递归展开后的实际制品（含派生 metadata）不得超过 500 个；整批失败时不产生部分变更。
      parameters:
        - $ref: "#/components/parameters/RepoNameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetOperationRequest"
      responses:
        "200":
          description: 操作已原子完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetOperationResponse"
        "400":
          $ref: "#/components/responses/AssetOperationBadRequest"
        "401":
          $ref: "#/components/responses/AssetOperationUnauthorized"
        "403":
          $ref: "#/components/responses/AssetOperationForbidden"
        "404":
          $ref: "#/components/responses/AssetOperationNotFound"
        "409":
          $ref: "#/components/responses/AssetOperationConflict"
        "500":
          $ref: "#/components/responses/AssetOperationInternalError"
  /api/v1/repositories/{name}/usage:
    get:
      operationId: getRepositoryUsage
      summary: 仓库客户端使用片段（据 format/type 返回接入命令）
      parameters:
