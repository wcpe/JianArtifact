          description: 桶起点（左闭），前端绘图 label 取此时间戳。
        to:
          type: string
          format: date-time
          description: 桶终点（右开）。
        group:
          type: string
          description: 分组取值：groupBy=ip 时为来源 IP 明文，=family 时为 UA 归类结果。
          minLength: 1
          maxLength: 255
        count:
          type: integer
          format: int64
          minimum: 0
