  /api/v1/users/{id}/publish-policies:
    put:
      operationId: putPublishPolicies
      summary: 批量更新用户在多个 Hosted 仓库的发布策略
      description: |
        发布策略是发布账号在**单个仓库**上的仓库级限制（FR-109）：它约束该账号在该仓库
        可发布的路径前缀、每小时新增制品数、每日上传字节数与单文件字节数，并配合仓库的
        immutableRelease 配置拒绝覆盖已发布的 Release 版本。
        本端点把同一份策略一次性**批量应用到多个仓库**，等价于对每个仓库分别调用
        PUT /api/v1/users/{id}/publish-policies/{repo}。
        为避免「部分仓库成功、部分仓库失败」的静默不一致：保存前先对所有仓库做统一预校验
        （仓库必须存在且为 hosted），任一仓库不合法即**整体拒绝**，错误信息会点名问题仓库。
        响应按仓库逐条返回结果，便于调用方在个别仓库落库失败时精确定位，而不会被静默吞掉。
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPoliciesBatchRequest"
      responses:
        "200":
          description: 逐仓库保存结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishPoliciesBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/users/{id}/publish-policies/{repo}:
    get:
      operationId: getPublishPolicy
      summary: 获取用户在 Hosted 仓库的发布策略
      parameters:
